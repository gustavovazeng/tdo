<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TDO — Captação — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer}
.funil-btn:hover{border-color:var(--border-h)}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.funil-dot.off{background:var(--hint)}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--green);letter-spacing:.04em}
.funil-status.off{color:var(--hint)}
.funil-caret{font-size:9px;color:var(--hint);margin-left:2px}
.funil-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:#1a2236;border:1px solid var(--border-h);border-radius:10px;box-shadow:0 10px 28px rgba(2,6,20,.5);padding:5px;z-index:30}
.funil-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border-radius:7px;border:none;background:transparent;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif}
.funil-item:hover{background:rgba(255,255,255,.06)}
.funil-item.active{background:rgba(59,130,246,.14)}
.funil-item-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-item-status{font-size:9px;color:var(--hint);letter-spacing:.04em}

.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

.hdr-right{display:flex;align-items:center;gap:8px}
.presets{display:flex;gap:4px}
.btn-pre{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .12s;white-space:nowrap}
.btn-pre:hover{border-color:var(--border-h);color:var(--text)}
.btn-pre.on{background:rgba(59,130,246,.16);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}
.drbox{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s;padding:0 6px;gap:3px}
.drbox:focus-within{border-color:rgba(96,165,250,.5)}
.drbox-icon{color:var(--hint);font-size:12px;user-select:none}
.drbox input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 4px;cursor:pointer;color-scheme:dark;width:100px}
.drbox-sep{color:var(--hint);font-size:11px;user-select:none}
.btn-update{background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.3);color:#60a5fa;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap;box-shadow:0 0 16px rgba(59,130,246,.2)}
.btn-update:hover:not(:disabled){box-shadow:0 0 16px rgba(59,130,246,.4)}
.btn-update:disabled{opacity:.4;cursor:not-allowed}

.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}
.notice{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:10px 16px;margin-bottom:18px;font-size:12px;color:var(--amber);line-height:1.5}

.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}

.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

.status-legend{display:flex;gap:16px;margin-bottom:14px}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}

.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

table{width:100%;border-collapse:collapse}
th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
th:hover{color:var(--text)}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:'JetBrains Mono',monospace}

.bar-row{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;padding:5px 0;font-size:11px}
.bar-track{height:8px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden}
.bar-fill{height:100%;border-radius:4px}

.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{color:var(--hint);font-size:13px}
.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(1)}

@media(max-width:768px){
  .app-hdr{height:auto;flex-wrap:wrap;padding:0;gap:0;align-items:stretch}
  .funil-wrap{padding:9px 14px;flex-shrink:0;border-bottom:1px solid var(--border);width:auto}
  .hdr-right{order:2;flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 14px 8px 8px;flex-wrap:nowrap;border-bottom:1px solid var(--border)}
  .hdr-right::-webkit-scrollbar{display:none}
  .presets{flex-wrap:nowrap;gap:3px}
  .btn-pre{font-size:10px;padding:4px 8px;flex-shrink:0}
  .drbox{flex-shrink:0}
  .drbox input[type=date]{width:86px;font-size:10px}
  .btn-update{font-size:11px;padding:5px 10px;flex-shrink:0}
  .hdr-tabs{order:3;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;gap:2px;padding:6px 14px 8px}
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .htab-icon{font-size:12px}
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}
  .g2,.g3,.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}
  [style*="1fr 1fr"]{grid-template-columns:1fr!important}
  [style*="1fr 420px"]{grid-template-columns:1fr!important}
  .page div[style*="overflow:hidden"]{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
  .page table{font-size:10px!important}
  .page td,.page th{padding:7px 8px!important;white-space:nowrap}
  .page td:first-child,.page th:first-child{white-space:normal;min-width:90px;max-width:140px}
  .status-legend{flex-wrap:wrap;gap:8px}
  .bar-row{grid-template-columns:100px 1fr 46px}
}
</style>
</head>
<body>
<header class="app-hdr">
  <div class="funil-wrap" id="funil-wrap"></div>
  <nav class="hdr-tabs" id="hdr-tabs">
    <button class="htab htab-active" onclick="navTo('captacao')">⊞ Captação</button>
    <button class="htab" onclick="navTo('aquecimento')">🔥 Aquecimento</button>
    <button class="htab" onclick="navTo('lembrete')">🔔 Lembrete</button>
    <button class="htab" onclick="navTo('aulas')">🎓 Aulas</button>
    <button class="htab" onclick="navTo('carrinho')">🛒 Carrinho</button>
    <button class="htab" onclick="navTo('planoreal')">📈 Planejado/Realizado</button>
    <button class="htab" onclick="navTo('resumo')">📋 Resumo diário</button>
  </nav>
  <div class="hdr-right">
    <div class="presets" id="hdr-presets">
      <button class="btn-pre" onclick="applyQuickCurrent('hoje')">Hoje</button>
      <button class="btn-pre" onclick="applyQuickCurrent('ontem')">Ontem</button>
      <button class="btn-pre" onclick="applyQuickCurrent('7d')">7 dias</button>
      <button class="btn-pre on" onclick="applyQuickCurrent('30d')">30 dias</button>
      <button class="btn-pre" onclick="applyQuickCurrent('mes')">Este mês</button>
    </div>
    <div class="drbox">
      <span class="drbox-icon">📅</span>
      <input type="date" id="hdr-start" onchange="onDCCurrent('s',this.value)"/>
      <span class="drbox-sep">→</span>
      <input type="date" id="hdr-end" onchange="onDCCurrent('e',this.value)"/>
    </div>
    <button class="btn-update" id="btn-update" onclick="loadData()">↻ Recarregar</button>
  </div>
</header>

<div class="app-content">
  <div class="sw" id="loading"><div class="sp"></div><p class="st">Carregando dados...</p></div>
  <nav class="hdr-tabs" id="subnav-captacao" style="display:none;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px"></nav>
  <nav class="hdr-tabs" id="subnav-carrinho" style="display:none;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px"></nav>
  <div id="page-principal" class="page active"></div>
  <div id="page-anuncios"  class="page"></div>
  <div id="page-metricas"  class="page"></div>
  <div id="page-leads"     class="page"></div>
  <div id="page-aquecimento" class="page"></div>
  <div id="page-lembrete"  class="page"></div>
  <div id="page-aulas"     class="page"></div>
  <div id="page-carrinho-principal" class="page"></div>
  <div id="page-carrinho-fichas"    class="page"></div>
  <div id="page-carrinho-vendas"    class="page"></div>
  <div id="page-carrinho-anuncios"  class="page"></div>
  <div id="page-planoreal" class="page"></div>
  <div id="page-resumo"    class="page"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   TDO — Captação de Leads — Dashboard (tdo_ago26)
   Fonte de dados: planilha viva do Google Sheets, buscada em tempo real via
   endpoint público do Google Visualization API (gviz) — sem embutir CSV no
   HTML. A planilha precisa estar compartilhada como "qualquer pessoa com o
   link, leitor"; senão o fetch falha (401/403) e cai em S.error.
     • Base Meta - captação  → investimento/cliques/impressões por anúncio/dia
     • Base leads            → leads reais capturados no funil (quiz, faixa,
       origem via UTM, dados demográficos)

   Adaptado do dashboard do oro_ago26: um único funil (tdo_ago26), KPI de
   "% conhece o Ramon" no lugar de "% conhece o Elton" e as metas do
   lançamento atualizadas.

   Metas do tdo_ago26 aplicadas em todas as abas de captação de leads
   (Principal, Anúncios, Métricas do tráfego, Leads, Planejado/Realizado e
   Resumo diário). Investimento e Cadastros seguem sem meta própria — o
   comparativo vem do planejamento diário (planoDiario).
   ════════════════════════════════════════════════════════════════════════ */

// ── Funis (seletor) ──────────────────────────────────────────────────────
// Cada funil é um lançamento/região com sua própria planilha e (opcionalmente)
// suas próprias metas/planejamento. As abas/colunas das planilhas são sempre
// no mesmo formato — só o conteúdo (sheetId) muda entre funis. Trocar de
// funil (switchFunil) reatribui as variáveis abaixo (todas `let`, não mais
// `const`, justamente pra permitir a troca) e recarrega os dados do zero.
const FUNIS = {
  tdo: {
    key:"tdo", label:"tdo_ago26", status:"ativo",
    sheetId:"1bfJbpZtAwVB8YxH6ri3zi5of6jkxzvKXofzyhyts3lc",
    // Metas do lançamento tdo_ago26.
    metaCpl:6.50, // Custo por cadastro AC Tráfego — menor é melhor
    metasResumo:{
      cpc:      {val:1.38,  higher:false}, // menor é melhor
      ctr:      {val:1.60,  higher:true},  // maior é melhor
      cpm:      {val:22.00, higher:false}, // menor é melhor
      quenteMorno:{val:50.00, higher:true},  // % público quente+morno — maior é melhor
      // Faixas A+/A/B/C/D/E (6 tiers) — A+/A/B: quanto maior, melhor (tiers
      // mais qualificados); C/D/E: quanto menor, melhor (tiers menos
      // qualificados).
      faixaAplus:{val:8.6,  higher:true},
      faixaA:    {val:20.9, higher:true},
      faixaB:    {val:21.5, higher:true},
      faixaC:    {val:34.8, higher:false},
      faixaD:    {val:11.1, higher:false},
      faixaE:    {val:3.1,  higher:false},
      quiz:     {val:85.00, higher:true},  // Tx de resposta da pesquisa — maior é melhor
      txConvPg: {val:27.00, higher:true},  // Tx conv. Pg cadastro = leads de tráfego ÷ sessões (Base GA4) — maior é melhor
      connectRate:{val:80.00, higher:true}, // sessões (Base GA4) ÷ cliques (Meta Ads) — maior é melhor
      // Sem meta definida ainda pra este lançamento — val:null faz o KPI
      // aparecer normalmente (valor + nº de respostas), mas sem 🎯/cor de
      // status e sem linha tracejada de meta no gráfico.
      ramon:    {val:null,  higher:true},  // % conhece o Ramon
      ad:       {val:null,  higher:true},  // % conhece a Aliança Divergente
      // Meta já fixada, mas SEM CÁLCULO implementado ainda — aguardando o
      // nome exato da pergunta na Base leads pra montar a fórmula:
      //  • indiceConsciencia: vem de uma pergunta da pesquisa (quiz).
      //  • txConvPgObrigado: sessão da pg. de cadastro → pg. de obrigado (GA4).
      indiceConsciencia:{val:42.00, higher:true},
      txConvPgObrigado: {val:35.00, higher:true},
    },
    // Sem benchmark definido ainda pra Aquecimento/Lembrete/Aulas/likes neste
    // lançamento — null-safe em todo o código de renderização.
    // Benchmark do Aquecimento — "Plan consolidado" do oro_jul25.
    aquecimentoMetas:{
      cpc:       {val:2.18,  higher:false}, // menor é melhor
      frequencia:{val:10.98, higher:true},  // meta a ALCANÇAR (repetição planejada)
      tx75:      {val:9.46,  higher:true},
      cptx75:    {val:0.54,  higher:false},
    },
    lembreteMetas:null,
    // Benchmark do Lembrete por DIAS QUE FALTAM até a Aula 01 (oro_jul25).
    // A chave é o nº de dias restantes — diasFaltamLembrete() calcula isso a
    // partir de PLANO_AULAS[0].date (24/08). CPC: menor é melhor;
    // frequência: é a repetição planejada pra aquele dia (alcançar é bom).
    lembreteBenchDia:{
      7:{cpc:0.50, freq:1.74},
      6:{cpc:0.58, freq:2.69},
      5:{cpc:0.64, freq:3.43},
      4:{cpc:0.67, freq:4.43},
      3:{cpc:0.74, freq:5.62},
      2:{cpc:0.77, freq:6.86},
      1:{cpc:0.79, freq:8.17},
    },
    aula01Metas:null,
    lembreteBenchmark:null,
    cplBenchmark:null,
    // Meta do Carrinho: custo por ficha COM PREÇO — menor é melhor.
    metaCarrinhoCustoFichaComPreco:40,
    // Planejamento diário — Captação de 13/08 a 24/08. "leads" recalculado a
    // partir do investimento diário ÷ meta de CPL (leads = round(inv/6.50)).
    // Replanejamento de 19/08: teto da captação passou para R$ 105.000.
    // Dias 13→19 CONGELADOS (R$ 82.242,00 no total, incluindo os
    // R$ 14.738,12 já fixados no dia 19). Os R$ 22.758,00 restantes: valor
    // LINEAR de 20 a 23/08 e o dia 24 em 60% do dia 23.
    // "leads" = investimento ÷ meta de CPL (R$ 6,50).
    planoDiario:[
      {date:"2026-08-13", investimento:0, leads:0},
      {date:"2026-08-14", investimento:20727.04, leads:3189},
      {date:"2026-08-15", investimento:5478.8, leads:843},
      {date:"2026-08-16", investimento:4989.99, leads:768},
      {date:"2026-08-17", investimento:15000, leads:2308},
      {date:"2026-08-18", investimento:21308.05, leads:3278},
      {date:"2026-08-19", investimento:14738.12, leads:2267},
      {date:"2026-08-20", investimento:4938, leads:760},
      {date:"2026-08-21", investimento:4950, leads:762},
      {date:"2026-08-22", investimento:4950, leads:762},
      {date:"2026-08-23", investimento:4950, leads:762},
      {date:"2026-08-24", investimento:2970, leads:457},
    ],
    // Aquecimento e Lembrete rodam na mesma semana (17/08→23/08), Aulas
    // gratuitas em 24-26/08, Carrinho de 27/08 a 03/09.
    planoAquecimento:[
      {date:"2026-08-18", investimento:968.89},
      {date:"2026-08-19", investimento:349.65},
      {date:"2026-08-20", investimento:180},
      {date:"2026-08-21", investimento:230},
      {date:"2026-08-22", investimento:370},
      {date:"2026-08-23", investimento:457.02},
    ],
    planoAquecimentoTotal:2555.56,
    planoLembrete:[
      {date:"2026-08-18", investimento:568.89},
      {date:"2026-08-19", investimento:339.65},
      {date:"2026-08-20", investimento:210},
      {date:"2026-08-21", investimento:410},
      {date:"2026-08-22", investimento:410},
      {date:"2026-08-23", investimento:617.02},
    ],
    planoAulas:[

function sheetCsvUrl(sheetName){

// Timeout próprio (20s): sem isso, uma aba que trave (rede lenta, planilha
// recém-criada ainda propagando, permissão de compartilhamento errada etc.)
// prende o loadData() inteiro pra sempre — como as abas são buscadas em
// sequência, uma trava aqui deixa o dashboard preso em "Carregando dados…"
// mesmo que todas as outras abas já tenham respondido.
async function fetchSheetCSV(sheetName, timeoutMs=20000){
  const ctrl = typeof AbortController!=="undefined" ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(),timeoutMs) : null;
  try{
    const res = await fetch(sheetCsvUrl(sheetName), {cache:"no-store", signal: ctrl?ctrl.signal:undefined});
    if(!res.ok) throw new Error(`Falha ao buscar aba "${sheetName}" (HTTP ${res.status}) — confira se a planilha está compartilhada como "qualquer pessoa com o link"`);
    return await res.text();
  }catch(e){
    if(e && e.name==="AbortError") throw new Error(`Tempo esgotado (${timeoutMs/1000}s) ao buscar aba "${sheetName}" — verifique a conexão ou se a planilha está acessível`);
    throw e;
  }finally{
    if(timer) clearTimeout(timer);
  }
}

// Parser de "DD/MM/YYYY HH:MM:SS" ("Submitted At" das fichas do Carrinho) →
// epoch ms (sem fuso — o ajuste -3h é aplicado depois, igual às demais datas
// deste dashboard). Diferente de toISO()/toISOLead(), que tratam só a data.
function parseFichaDateTimeMs(s){
  if(!s)return null;
  const [datePart,timePart]=String(s).trim().split(" ");
  if(!datePart)return null;
  const p=datePart.split("/");
  if(p.length!==3)return null;
  const da=parseInt(p[0]),mo=parseInt(p[1]),y=parseInt(p[2].length===4?p[2]:"20"+p[2]);
  if(!y||!mo||!da)return null;
  let hh=0,mi=0,ss=0;
  if(timePart){
    const t=timePart.split(":").map(n=>parseInt(n)||0);
    hh=t[0]||0;mi=t[1]||0;ss=t[2]||0;
  }
  return Date.UTC(y,mo-1,da,hh,mi,ss);
}
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
function fDateBR(iso){ if(!iso)return"—";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function fDateTimeBR(ms){
  if(ms==null)return"—";
  const d=new Date(ms);
  return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")} ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
}
function toISO(s){
  if(!s||s==="Date"||s==="")return null;
  s=String(s).trim().split(" ")[0];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const p=s.split("/");
  if(p.length===3){
    const y=p[2].length===4?p[2]:"20"+p[2];
    const a=parseInt(p[0]),b=parseInt(p[1]);
    if(b>12){ return `${y}-${p[0].padStart(2,"0")}-${p[1].padStart(2,"0")}`; }
    return `${y}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
  }
  return null;
}
function msToISO(ms){
  const d=new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
// "created_at" das leads já veio em dois formatos diferentes na mesma
// planilha, dependendo de como ela é exportada/lida:
//  • ISO-8601 UTC:  "2026-08-13T03:13:09.768Z"   (Date.parse lida bem)
//  • BR:            "13/08/2026 00:13:09"        (sem T/Z — o valor já é a
//    hora de Brasília: repare que "03:13:09Z" (UTC) = "00:13:09" BRT pro
//    MESMO lead — ou seja, esse formato NÃO precisa de ajuste de fuso, só o
//    ISO precisa, porque o BR já vem convertido)
// Date.parse(s) sozinho não dá pra usar pro formato BR: motores JS tratam
// "DD/MM/YYYY" como MM/DD/YYYY (ou dão NaN quando o dia é >12, derrubando a
// lead inteira). Isso já fez TODAS as leads com dia >12 sumirem
// silenciosamente numa planilha (e as com dia ≤12 caírem no dia trocado).
// Por isso: detecta o formato pela presença de "T" (ISO) e trata cada um
// com a conversão de fuso correta pra ele.
function toISOLead(s){
  if(!s)return null;
  const str=String(s).trim();
  let ms;
  if(/^\d{4}-\d{2}-\d{2}T/.test(str)){
    // ISO-8601 UTC — Date.parse é confiável aqui (sem ambiguidade de locale).
    // Precisa do -3h: é UTC de verdade, não hora de Brasília ainda.
    ms=Date.parse(str);
    if(isNaN(ms))return null;
    return {ms,date:msToISO(ms-3*60*60*1000)};
  }
  // Formato BR "DD/MM/YYYY HH:MM:SS" — parse manual (mesma técnica de
  // parseFichaDateTimeMs, pro "Submitted At" das fichas do Carrinho). Já
  // vem em hora de Brasília, então NÃO aplica -3h de novo aqui.
  const [datePart,timePart]=str.split(" ");
  if(!datePart)return null;
  const p=datePart.split("/");
  if(p.length!==3)return null;
  const da=parseInt(p[0]),mo=parseInt(p[1]),y=parseInt(p[2].length===4?p[2]:"20"+p[2]);
  if(!y||!mo||!da)return null;
  let hh=0,mi=0,ss=0;
  if(timePart){
    const t=timePart.split(":").map(n=>parseInt(n)||0);
    hh=t[0]||0;mi=t[1]||0;ss=t[2]||0;
  }
  ms=Date.UTC(y,mo-1,da,hh,mi,ss);
  if(isNaN(ms))return null;
  return {ms,date:msToISO(ms)};
}

// ── Status helpers ────────────────────────────────────────────────────────
function statusColor(val,meta,higherIsBetter){
  // meta==null → KPI sem meta definida neste lançamento: nada de verde/
  // amarelo/vermelho, só o cinza neutro (mesmo tratamento de valor ausente).
  if(meta==null)return "#8a96ab";
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.22)";
  if(c==="#fbbf24") return "rgba(251,191,36,.22)";
  if(c==="#f87171") return "rgba(248,113,113,.22)";
  return "var(--border)";
}

// ── CSV parser ────────────────────────────────────────────────────────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return result;
}
function parseRows(rows){
  if(rows.length<2)return[];
  const h=rows[0];
  return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));
}
// Parser genérico pras 3 bases de etapa (Aquecimento/Lembrete/Aulas) — todas
// têm o mesmo formato básico (Date, Campaign Name, Spend, Action Link
// Clicks, Impressions, Video 75%...), com pequenas variações de colunas que
// não usamos aqui (Cost per Inline Link Click é recalculado por nós mesmos,
// pra ficar consistente com o resto do dashboard).
function parseStageRows(rowsRaw){
  const out=[];
  for(const r of rowsRaw){
    const d=toISO(r["Date"]);if(!d)continue;
    const spend=parseBRL(r["Spend (Cost, Amount Spent)"]);
    const clicks=parseInt(r["Action Link Clicks"]||0)||0;
    const impressions=parseInt(r["Impressions"]||0)||0;
    const video75=parseInt(r["Video 75 Percent Watched Actions"]||0)||0;
    // "Views 3s": Aquecimento/Lembrete usam "Action 3s Video Views"; Aulas usa "Action Video View".
    const view3s=parseInt(r["Action 3s Video Views"]??r["Action Video View"]??0)||0;
    const campName=(r["Campaign Name"]||"").trim();
    const adName=(r["Ad Name"]||"").trim();
    const igUrl=(r["Instagram Permalink URL"]||"").trim();
    out.push({date:d,campName,adName,igUrl,spend,clicks,impressions,video75,view3s});
  }
  return out;
}

// ── Attribution helpers (UTM → anúncio/campanha do Meta Ads) ───────────────
// Padrão de UTM do Meta Ads exportado neste funil:
//   utm_medium  = "{nome campanha}id{campaign_id}"
//   utm_content = "{nome anúncio}id{ad_id}"
//   utm_term    = "{nome conjunto}id{adset_id}"
// BUG histórico corrigido: os dados reais vêm como "{nome}_id_{id}" (com
// underscore dos dois lados de "id"), não "{nome}id{id}" colado como o
// regex original assumia. Isso fazia extractIdSuffix() retornar null pra
// TODA lead real (ex.: "oro_mar25-leads-adv016f_id_120252916000360202"),
// quebrando silenciosamente o cruzamento lead↔campanha/anúncio da Base Meta
// — Leads e Faixas ficavam sempre vazios nas tabelas de Campanhas/Anúncios,
// mesmo com dado nas duas planilhas. "_?" nas pontas mantém compatibilidade
// com um formato antigo sem underscore, se aparecer.
// BUG 2 (tdo_ago26): a exportação da Base leads vem com um byte corrompido
// no FIM de todo utm_content — ex.: "tdo_ago26-leads-adv011_id_120252161502030421\uFFFD".
// Como os dois regex abaixo ancoram no fim da string ($), esse caractere
// invisível fazia extractIdSuffix() devolver null pras 500 leads e o nome do
// anúncio virar a UTM inteira (com o lixo junto) — nenhum nome batia com a
// Base Meta e a tabela de Anúncios ficava com Leads = 0 em todas as linhas.
// (utm_medium vem limpo, por isso a tabela de Campanhas funcionava.)
// cleanUtm() apara do fim qualquer caractere de substituição/controle/espaço
// antes de aplicar os regex.
function cleanUtm(s){
  return String(s||"").replace(/[\uFFFD\u0000-\u001F\u007F-\u009F\s]+$/,"").trim();
}
function extractIdSuffix(s){
  const m=cleanUtm(s).match(/_?id_?(\d{10,})$/);
  return m?m[1]:null;
}
function extractNamePrefix(s){
  const v=cleanUtm(s);
  const m=v.match(/^(.+?)_?id_?\d{10,}$/);
  return m?m[1]:(v||null);
}
// ── Pontuação e faixa da pesquisa (cálculo próprio) ───────────────────────
// As colunas "faixa" e "score_total" da Base leads são IGNORADAS de
// propósito: a planilha usa uma tabela de pontos desatualizada (Empresário
// 52,00 · Parcialmente 23,51 · Doutorado 31,24) e não classifica A+, o que
// jogava toda lead de A+ dentro de A. Aqui o score é recalculado do zero a
// partir das 10 respostas da pesquisa, com a tabela oficial abaixo, e a
// faixa sai desse score. Isso vale pra TODA métrica de faixa do dashboard
// (tabelas, gráficos diários, Resumo diário, campanhas e anúncios).
const SCORE_PONTOS = {
  idade:{"18-24":7.13,"25-35":14.78,"36-45":19.25,"46-55":18.55,"56 ou mais":14.6},
  escolaridade:{"ensino fundamental 1 (1o ao 5o ano)":6.42,"ensino fundamental 2 (6o ao 9o ano)":7.64,
    "ensino medio (1o ao 3o)":8.88,"ensino superior incompleto":14.1,
    "ensino superior (graduacao/faculdade)":20.95,"pos-graduacao":23.97,"mestrado":37.31,"doutorado":37.24},
  sexo:{"sou do sexo feminino":12.86,"sou do sexo masculino":22.18},
  filhos:{"nao":18.83,"sim":14.68},
  renda:{"ate r$ 1.000,00":6.86,"de r$ 1.101,00 a r$ 2.500,00":9.82,"de r$ 2.501,00 a r$ 4.000,00":16.21,
    "de r$ 4.001,00 a r$ 10.000,00":25.55,"acima de r$ 10.000,00":40.83},
  trabalho:{"autonomo":20.61,"empresario":46.88,"funcionario publico":10.4,"funcionario clt":8.15,
    "aposentado":10.26,"funcionario pj":20.61,"estou desempregado no momento":10.44,"profissional liberal":31.52},
  solidao:{"nunca":6.73,"raramente":11.39,"as vezes":13.96,"frequentemente":22.26,"sempre":20.94},
  terapia:{"nao":8.31,"sim":29.04},
  eficaz:{"nunca fiz":11.24,"nao":16.32,"sim":13.89,"parcialmente":26.51},
};
// Estado civil casa por PREFIXO: a tabela oficial escreve "Solteira(o)" e a
// Base leads grava "Solteiro(o)" — o prefixo pega as duas grafias.
const SCORE_CIVIL = [["solteir",14.39],["casad",14.57],["separad",19.99],["viuv",14.63]];
// Colunas da Base leads que alimentam cada bloco de pontos.
const SCORE_COLS = {
  idade:"Em qual faixa etária você se encaixa?",
  escolaridade:"Qual é o seu nível de escolaridade?",
  sexo:"Qual seu sexo?",
  filhos:"Você tem filhos?",
  renda:"Qual das opções representa a sua renda mensal hoje?",
  trabalho:"Você trabalha como (marque o trabalho que te gera mais renda):",
  solidao:"Com que frequência você se sente sozinho(a)/travado(a) e com baixos resultados?",
  terapia:"Você já buscou algum tipo de ajuda ou suporte (terapia, coaching, grupos de apoio) para lidar com seus desafios emocionais?",
  eficaz:"Se sim, o método utilizado foi eficaz?",
};
const SCORE_COL_CIVIL = "Qual seu estado civil?";
// NFKD + remoção de acentos: "Ensino Médio (1º ao 3º)" → "ensino medio (1o ao 3o)".
// Deixa o cruzamento imune a acento, caixa, espaço duplo e ao indicador
// ordinal (º), que é o que mais varia entre exportações da planilha.
function normResposta(s){
  return String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/\s+/g," ").trim();
}
// Soma dos pontos das 10 respostas. Devolve null se QUALQUER resposta
// estiver ausente ou não reconhecida — lead sem pesquisa completa não recebe
// faixa e fica fora do denominador (mesmo critério de antes).
function scoreLead(r){
  let total=0;
  for(const k in SCORE_COLS){
    const pt=SCORE_PONTOS[k][normResposta(r[SCORE_COLS[k]])];
    if(pt==null)return null;
    total+=pt;
  }
  const civ=normResposta(r[SCORE_COL_CIVIL]);
  const hit=SCORE_CIVIL.find(([pre])=>civ.startsWith(pre));
  if(!hit)return null;
  total+=hit[1];
  return Math.round(total*100)/100;
}
// Cortes oficiais das faixas. Limite INFERIOR inclusivo, superior exclusivo —
// é isso que garante que cada lead caia em uma única faixa, sem sobreposição
// nas bordas (ex.: 180,3 exato é A, nunca B; 204,2 exato é A+, nunca A).
const FAIXA_CORTES = [["A+",204.2],["A",180.3],["B",162.7],["C",136.3],["D",124.9],["E",0]];
function faixaFromScore(score){
  if(score==null)return "";
  const hit=FAIXA_CORTES.find(([,min])=>score>=min);
  return hit?hit[0]:"";
}

// Temperatura do público vem no NOME DA CAMPANHA (ex.: "...-conversao-quente-...",
// "...-conversao-frio-faixaAB_2.0-leva01") — não no campo "temperature_name" da
// Base leads, que nesta base vem sempre "Frio" independente da campanha real.
function campaignTemperature(campName){
  const c=String(campName||"").toLowerCase();
  if(c.includes("quente"))return "Quente";
  if(c.includes("morno"))return "Morno";
  if(c.includes("frio"))return "Frio";
  return "";
}
// Etapa do lançamento a que uma campanha pertence, extraída do NOME DA
// CAMPANHA (mesmo princípio da temperatura) — ex.: campanha de Lembrete
// contém "lembrete" no nome, Aquecimento contém "aquecimento", etc. Sem
// nenhuma dessas palavras, assume Captação (é a etapa atual do lançamento e
// a maioria das campanhas de hoje são dela). Usado pra não deixar o
// investimento de uma campanha vazar pro "realizado" de outra etapa só
// porque a data bate — cada real é filtrado por campanha, não só por data.
function campaignStage(campName){
  const c=String(campName||"").toLowerCase();
  if(c.includes("lembrete"))return "Lembrete";
  if(c.includes("aquecimento"))return "Aquecimento";
  if(c.includes("aula"))return "Aulas";
  if(c.includes("carrinho"))return "Carrinho";
  return "Captação";
}
// Linhas de investimento de uma etapa. Aquecimento/Lembrete/Aulas têm sheet
// própria (S.aquecimentoRows/S.lembreteRows/S.aulasRows — mesma fonte que já
// alimenta as abas dessas etapas e o Resumo diário), então usamos elas
// direto. Captação e Carrinho não têm sheet de mídia própria — continuam
// vindo da Base Meta - captação, filtrada por campanha (via campaignStage).
// Antes, Aquecimento/Lembrete/Aulas também tentavam filtrar S.metaRows por
// campaignStage, mas as campanhas dessas 3 etapas não estão nessa sheet (só
// nas sheets próprias) — por isso "Planejado/Realizado" sempre mostrava
// R$0,00 de realizado ali, mesmo com investimento normal nas outras abas.
function stageRowsForStage(stage){
  if(stage==="Aquecimento")return S.aquecimentoRows||[];
  if(stage==="Lembrete")return S.lembreteRows||[];
  if(stage==="Aulas")return S.aulasRows||[];
  return S.metaRows.filter(r=>campaignStage(r.campName)===stage);
}
// Investimento realizado de uma etapa numa data específica.
function stageSpendForDate(stage,date){
  return stageRowsForStage(stage).filter(r=>r.date===date).reduce((a,r)=>a+r.spend,0);
}
// Investimento realizado total de uma etapa (todas as datas) — usado no
// "Resumo por etapa" do Planejado/Realizado.
function totalSpendForStage(stage){
  return stageRowsForStage(stage).reduce((a,r)=>a+r.spend,0);
}

// Mesma lógica do metaEmoji() usado no Resumo diário (🟢/🟡/🔴/⚪), só que
// acessível globalmente pras novas abas de etapa (Aquecimento/Lembrete/Aulas).
function metaEmojiGlobal(val,meta,higherIsBetter){
  if(meta==null) return "";   // sem meta definida → não pontua status
  if(val==null) return "⚪";
  if(!val) return "🔴";
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399")return "🟢";
  if(c==="#fbbf24")return "🟡";
  return "🔴";
}
// Número da aula (1/2/3) a partir do nome da campanha — ex.: contém "aula01"
// ou "aula 1". null se não identificar nenhuma aula no nome.
function aulaNumberFromCampaign(campName){
  const c=String(campName||"").toLowerCase();
  const m=c.match(/aula\s*0?(\d)/);
  return m?m[1]:null;
}
function sumStageRows(rows){
  return rows.reduce((a,r)=>({spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,video75:a.video75+r.video75,view3s:a.view3s+(r.view3s||0)}),
    {spend:0,clicks:0,impressions:0,video75:0,view3s:0});
}
// Métricas agregadas de uma etapa (Aquecimento/Lembrete/Aulas): CPC vem de
// spend/clicks (recalculado, não da coluna pronta do CSV, pra consistência
// com o resto do dashboard). Tx75%/CPtx75% usam Impressões como base (não
// temos "Video Plays" nessas bases) — ajustar se um dia existir esse dado.
function stageMetrics(rows){
  const t=sumStageRows(rows);
  const cpc=t.clicks>0?t.spend/t.clicks:null;
  const tx75=t.impressions>0?(t.video75/t.impressions)*100:null;
  const cptx75=t.video75>0?t.spend/t.video75:null;
  return{...t,cpc,tx75,cptx75};
}

// ── Carrinho: fichas de interesse (Tráfego/Orgânico/Disparo) ──────────────
// Mesmo modelo replicado de outro projeto: 3 bases de fichas do formulário
// "Ficha de Interesse", casadas com anúncio/campanha via UTM (só Tráfego —
// Orgânico/Disparo não tem UTM de anúncio) e deduplicadas por telefone/e-mail.
// A pergunta de preço/forma de pagamento pode não existir ou sair do formulário
// no meio do lançamento (já aconteceu antes) — por isso a coluna é encontrada
// por um trecho do texto ("forma de pagamento"), não pelo nome exato da
// pergunta (que muda a cada lançamento conforme o preço/oferta do momento).
function findPrecoKey(headers){
  return headers.find(h=>/forma de pagamento/i.test(h))||null;
}
// Unifica fichas da mesma pessoa (telefone OU e-mail em comum) mantendo só a
// mais antiga — mesma técnica de Union-Find do modelo original.
// Dedup genérico por contato (telefone OU e-mail, union-find — liga registros
// transitivamente mesmo quando só um dos dois campos bate) — mantém, de cada
// grupo, o registro com menor "ms" (a inscrição/ficha mais antiga da pessoa).
// Espera itens com {phone,email,ms} já normalizados (normalizePhone/
// normalizeEmail). Usado tanto pras fichas do Carrinho quanto pra Base leads.
function dedupByContact(items){
  const parent={};
  function find(x){ if(!(x in parent))parent[x]=x; while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];} return x; }
  function union(a,b){ const ra=find(a),rb=find(b); if(ra!==rb)parent[ra]=rb; }
  items.forEach((it,i)=>{
    const kRow="r:"+i; find(kRow);
    if(it.phone)union(kRow,"p:"+it.phone);
    if(it.email)union(kRow,"e:"+it.email);
  });
  const groups={};
  items.forEach((it,i)=>{
    const root=find("r:"+i);
    if(!groups[root]||it.ms<groups[root].ms)groups[root]=it;
  });
  return Object.values(groups);
}
function dedupFichasByContact(fichas){ return dedupByContact(fichas); }
// Processa as 3 bases já parseadas (linhas cruas) e popula todo o estado
// S.carrinho* de uma vez. Precisa rodar DEPOIS que S.adIdMap (Base Meta) já
// foi montado, pra conseguir casar as fichas de tráfego com anúncio/campanha.
function processCarrinhoFichas(trafRowsRaw,orgRowsRaw,dispRowsRaw){
  const precoKeyTraf=trafRowsRaw.length?findPrecoKey(Object.keys(trafRowsRaw[0])):null;
  const precoKeyOrg=orgRowsRaw.length?findPrecoKey(Object.keys(orgRowsRaw[0])):null;
  const precoKeyDisp=dispRowsRaw.length?findPrecoKey(Object.keys(dispRowsRaw[0])):null;
  S.carrinhoPrecoKeyFound=!!(precoKeyTraf||precoKeyOrg||precoKeyDisp);

  const trafD={}, trafDComPreco={};
  const orgD={}, orgDComPreco={};
  const fichaAttrib=[], fichaOrigem=[];

  function processRow(r,tipo,precoKey){
    const ms=parseFichaDateTimeMs(r["Submitted At"]);
    if(ms==null)return;
    const d=msToISO(ms-3*60*60*1000); // mesmo ajuste -3h das demais datas deste dashboard
    const comPreco=precoKey?!!(r[precoKey]||"").trim():null;
    const phone=normalizePhone(r["Qual seu WhatsApp?"]);
    const email=normalizeEmail(r["Qual seu E-mail?"]);
    const utmSrc=(r["utm_source"]||"").trim();
    const utmMed=(r["utm_medium"]||"").trim();
    const utmCont=(r["utm_content"]||r["utm_term"]||"").trim();
    let adName=null, campName=null;
    if(tipo==="traf"){
      // Mesmo padrão de UTM/Ad ID já usado pra atribuir a Base leads (Captação):
      // utm_medium="{campanha}id{campId}", utm_content="{anúncio}id{adId}".
      const rawAdId=extractIdSuffix(utmCont);
      const rawAdName=extractNamePrefix(utmCont);
      const rawCampName=extractNamePrefix(utmMed);
      adName=rawAdName; campName=rawCampName;
      if(rawAdId&&S.adIdMap[rawAdId]){
        adName=S.adIdMap[rawAdId].adName||rawAdName;
        campName=S.adIdMap[rawAdId].campName||rawCampName;
      }
      trafD[d]=(trafD[d]||0)+1;
      if(comPreco)trafDComPreco[d]=(trafDComPreco[d]||0)+1;
      fichaAttrib.push({date:d,adName:adName||"(sem atribuição)",campName:campName||"(sem atribuição)",comPreco:!!comPreco});
    }else{
      orgD[d]=(orgD[d]||0)+1;
      if(comPreco)orgDComPreco[d]=(orgDComPreco[d]||0)+1;
    }
    // adName/campName vão junto na fichaOrigem (não só na fichaAttrib) pra dar
    // pra atribuir uma VENDA casada com esta ficha ao mesmo anúncio/campanha,
    // sem precisar cruzar duas listas por telefone/e-mail de novo.
    fichaOrigem.push({date:d,ms,tipo,origem:utmSrc||"(não informado)",canal:utmMed||"(não informado)",phone,email,comPreco,
      adName:tipo==="traf"?(adName||"(sem atribuição)"):null,campName:tipo==="traf"?(campName||"(sem atribuição)"):null});
  }

  for(const r of trafRowsRaw)processRow(r,"traf",precoKeyTraf);
  for(const r of orgRowsRaw)processRow(r,"org",precoKeyOrg);
  for(const r of dispRowsRaw)processRow(r,"org",precoKeyDisp); // disparo somado com orgânico, mesmo padrão do modelo original

  S.carrinhoTrafego=trafD; S.carrinhoTrafegoComPreco=trafDComPreco;
  S.carrinhoOrganico=orgD; S.carrinhoOrganicoComPreco=orgDComPreco;
  S.carrinhoFichaAttrib=fichaAttrib;
  S.carrinhoFichaOrigem=fichaOrigem;
  S.carrinhoFichaOrigemUnica=dedupFichasByContact(fichaOrigem);
}
// Casa vendas ("Base vendas": Nome/Email/Whatsapp1/Data Correta/UTM Source —
// sem valor de venda, então não dá pra calcular faturamento/ROAS aqui) com a
// ficha mais antiga da pessoa (tráfego ou orgânico, o que veio primeiro),
// batendo por telefone OU e-mail. Precisa rodar DEPOIS de processCarrinhoFichas
// (usa S.carrinhoFichaOrigem já processado como fonte de verdade de quem
// preencheu o quê). "Data Correta" já vem certa (sem ajuste de fuso) — mesmo
// tratamento do modelo original.
function processCarrinhoVendas(vendasRowsRaw){
  const earliestByPhone={}, earliestByEmail={};
  for(const f of S.carrinhoFichaOrigem){
    if(f.phone&&(!earliestByPhone[f.phone]||f.ms<earliestByPhone[f.phone].ms))earliestByPhone[f.phone]=f;
    if(f.email&&(!earliestByEmail[f.email]||f.ms<earliestByEmail[f.email].ms))earliestByEmail[f.email]=f;
  }
  const vendaAttrib=[], vendaOrigem=[], porDia={};
  let total=0, matched=0, unmatched=0;
  for(const r of vendasRowsRaw){
    const nome=(r["Nome"]||"").trim();
    const ph=normalizePhone(r["Whatsapp1"]||r["Whatsapp"]||r["Telefone"]);
    const em=normalizeEmail(r["Email"]);
    if(!nome&&!ph&&!em)continue; // linha vazia
    total++;
    const ms=parseFichaDateTimeMs(r["Data Correta"]);
    const d=ms!=null?msToISO(ms):null;
    if(d)porDia[d]=(porDia[d]||0)+1;
    const candidates=[];
    if(ph&&earliestByPhone[ph])candidates.push(earliestByPhone[ph]);
    if(em&&earliestByEmail[em])candidates.push(earliestByEmail[em]);
    if(candidates.length){
      candidates.sort((a,b)=>a.ms-b.ms);
      const best=candidates[0];
      matched++;
      const vd=d||best.date; // fallback pra data da ficha se "Data Correta" vier vazia/quebrada
      if(best.tipo==="traf"){
        vendaAttrib.push({date:vd,adName:best.adName||"(sem atribuição)",campName:best.campName||"(sem atribuição)"});
      }
      vendaOrigem.push({date:vd,tipo:best.tipo,origem:best.origem,canal:best.canal,comPreco:best.comPreco});
    }else{
      unmatched++;
    }
  }
  S.carrinhoVendaAttrib=vendaAttrib;
  S.carrinhoVendaOrigem=vendaOrigem;
  S.carrinhoVendasPorDia=porDia;
  S.carrinhoVendasTotal=total; S.carrinhoVendasMatched=matched; S.carrinhoVendasUnmatched=unmatched;
}

// ── Base GA4 (dados de página) ──────────────────────────────────────────────
// Regras combinadas com o usuário:
//  • Só sessões de tráfego pago reconhecido (Session Source começa com
//    "FBAds") — exclui orgânico (ActiveCampaign, whatsapp, ytb-ramon etc.).
//  • Exclusão da página de PESQUISA (quiz, acessada só DEPOIS do cadastro —
//    não deve entrar no Connect Rate nem na conversão de página, que medem o
//    funil até o cadastro): FEITA — ver GA4_PATHS_EXCLUIDOS abaixo.
//  • "Sessions" = visitas únicas (métrica usada pra Connect Rate/conversão);
//    "Page Views" fica disponível mas não usado nesses dois cálculos.
// Temperatura extraída do "Session Medium" (= utm_medium = nome da campanha),
// mesmo critério já usado pra Base Meta/Base leads (campaignTemperature).
// Páginas que NÃO fazem parte do funil até o cadastro e por isso ficam fora
// de toda a análise de páginas (Connect Rate, Tx conv Pg cadastro e a tabela
// "Página (GA4)" da aba Principal):
//  • /quiz-tdo         → pesquisa, acessada só DEPOIS do cadastro
//  • /tdo/v1/h1/1/org  → tráfego orgânico, não entra na conta do pago
// Comparação normalizada (sem barra final e sem querystring) pra não
// escapar por causa de "/quiz-tdo/" ou "/quiz-tdo?utm=...".
const GA4_PATHS_EXCLUIDOS = ["/quiz-tdo","/tdo/v1/h1/1/org"];
function normPath(p){
  return String(p||"").trim().split("?")[0].split("#")[0].replace(/\/+$/,"").toLowerCase();
}
function ga4PathExcluido(p){
  const v=normPath(p);
  return GA4_PATHS_EXCLUIDOS.some(x=>normPath(x)===v);
}
function processGA4(rowsRaw){
  const rows=[];
  for(const r of rowsRaw){
    const date=toISO(r["Date"]);if(!date)continue;
    const source=(r["Session Source"]||"").trim();
    if(!source.startsWith("FBAds"))continue;
    const pagePath=(r["Page Path"]||"").trim();
    if(ga4PathExcluido(pagePath))continue;
    const sessionMedium=(r["Session Medium"]||"").trim();
    const sessions=parseInt(r["Sessions"],10)||0;
    const pageViews=parseInt(r["Page Views"],10)||0;
    rows.push({date,pagePath,sessions,pageViews,temperatureName:campaignTemperature(sessionMedium)});
  }
  return rows;
}
// start/end = null → sem limite naquele lado (mesma convenção de leadsInRange
// / periodTotals — usado pelo "Total - Consolidado" do Resumo diário).
// SEMPRE exclui o dia de hoje: o GA4 tem atraso de processamento e os dados
// de "hoje" ainda não fecharam — contá-los distorceria Connect Rate, Tx conv
// Pg cadastro e a tabela de página. Vale independente do range pedido (se o
// range pedir "hoje", ele simplesmente não aparece).
function ga4RowsInRange(start,end,temp){
  const map={quente:"Quente",morno:"Morno",frio:"Frio"};
  const today=todayISO();
  return S.ga4Rows.filter(r=>r.date!==today&&(start===null||r.date>=start)&&(end===null||r.date<=end)&&(!temp||temp==="todos"||r.temperatureName===map[temp]));
}
function ga4Metrics(start,end,temp){
  const rows=ga4RowsInRange(start,end,temp);
  return rows.reduce((a,r)=>({sessions:a.sessions+r.sessions,pageViews:a.pageViews+r.pageViews}),{sessions:0,pageViews:0});
}
// Tabela "Página (GA4)" da aba Principal: sessões por Page Path no período,
// casadas com os cadastros REAIS daquela página — a Base leads tem a coluna
// "path" (a página onde a pessoa se cadastrou), que usa o mesmo valor do
// "Page Path" da Base GA4 (ex.: "/v1/h3/f"). Nada de estimativa/rateio:
// cada cadastro é contado só na página em que ele realmente aconteceu.
function getGA4PageRows(start,end){
  const rows=ga4RowsInRange(start,end,"todos");
  const byPath={};
  for(const r of rows){
    const key=r.pagePath||"(sem página)";
    if(!byPath[key])byPath[key]={pagePath:key,sessions:0};
    byPath[key].sessions+=r.sessions;
  }
  const leadsTrafego=leadsForChannel(leadsInRange(start,end),"trafego");
  const cadastrosByPath={};
  for(const l of leadsTrafego){
    const key=l.path||"(sem página)";
    cadastrosByPath[key]=(cadastrosByPath[key]||0)+1;
  }
  // Garante que uma página com cadastro apareça mesmo sem sessão de GA4
  // registrada no período (ex.: GA4 ainda não propagou aquele dia).
  for(const key in cadastrosByPath){
    if(!byPath[key])byPath[key]={pagePath:key,sessions:0};
  }
  return Object.values(byPath).map(p=>{
    const cadastros=cadastrosByPath[p.pagePath]||0;
    return{...p,cadastros,convPagina:p.sessions>0?(cadastros/p.sessions)*100:null};
  }).sort((a,b)=>b.sessions-a.sessions);
}

// ── Contagem de likes (YouTube) — Lembrete + CPLs ───────────────────────────
// Planilha "Contagem likes": Data, Hora, Likes. Normaliza a Hora pra
// "HH:MM" (a exportação do Google Sheets pode vir com segundos, ex. "12:00:00").
function normalizeHora(s){
  if(!s)return null;
  const p=String(s).trim().split(":");
  if(p.length<2)return null;
  const h=parseInt(p[0],10),m=parseInt(p[1],10);
  if(isNaN(h)||isNaN(m))return null;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function processLikes(rowsRaw){
  const out=[];
  for(const r of rowsRaw){
    const date=toISO(r["Data"]);if(!date)continue;
    const time=normalizeHora(r["Hora"]);if(!time)continue;
    const likes=parseInt(String(r["Likes"]||"").replace(/\D/g,""),10);
    if(isNaN(likes))continue;
    out.push({date,time,likes});
  }
  return out;
}
// "Dias que faltam" até a Aula 01 (referência do countdown do Lembrete) —
// PLANO_AULAS[0].date é a data real da Aula 01 no calendário deste
// lançamento. Ex.: 03/08 → 7 dias faltam; 09/08 (domingo) → 1 dia falta.
function diasFaltamLembrete(dateISO){
  const aula1=PLANO_AULAS[0]?.date; if(!aula1)return null;
  const ms=Date.parse(aula1+"T00:00:00Z")-Date.parse(dateISO+"T00:00:00Z");
  return Math.round(ms/86400000);
}
// A qual Aula (1/2/3) pertence essa data, pela agenda real (PLANO_AULAS).
function aulaNumForDate(dateISO){
  const idx=PLANO_AULAS.findIndex(p=>p.date===dateISO);
  return idx>=0?idx+1:null;
}
// Checkpoint de hora mais próximo dentre os 11 fixos (09:30…19:30) — usado
// pra casar um registro de likes com a linha certa do benchmark do CPL.
function nearestCplHour(time){
  const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m;};
  const target=toMin(time);
  let best=CPL_HOURS[0],bestDiff=Infinity;
  for(const h of CPL_HOURS){
    const diff=Math.abs(toMin(h)-target);
    if(diff<bestDiff){bestDiff=diff;best=h;}
  }
  return best;
}
// Linhas de likes do Lembrete: só o checkpoint das 12:00 de cada dia (regra
// fixa pedida — nunca comparamos outro horário do Lembrete), uma por dia,
// com o "dias que faltam" e a meta (fatorX benchmark × leads ao vivo).
function lembreteLikesRows(leadsAoVivo){
  // Só considera checkpoints das 12:00 DENTRO da janela real do Lembrete
  // (dias que faltam 1-7, ou seja, dentro de PLANO_LEMBRETE) — uma linha
  // batida às 12:00 num dia de Aula, por exemplo, não entra aqui.
  const rows=S.likesRows.filter(r=>{
    if(r.time!=="12:00")return false;
    const d=diasFaltamLembrete(r.date);
    return d!=null&&d>=1&&d<=7;
  }).sort((a,b)=>a.date<b.date?-1:1);
  return rows.map(r=>{
    const diasFaltam=diasFaltamLembrete(r.date);
    const fatorX=LEMBRETE_BENCHMARK_OUT25?LEMBRETE_BENCHMARK_OUT25[diasFaltam]:null;
    const meta=fatorX!=null?(fatorX/100)*leadsAoVivo:null;
    return{date:r.date,diasFaltam,likes:r.likes,fatorX,meta};
  });
}
// Linhas de likes de uma Aula (checkpoint hora-em-hora), casando cada
// registro com o horário mais próximo do benchmark daquele CPL específico.
function aulaLikesRows(aulaNum,leadsAoVivo){
  const dateForAula=PLANO_AULAS[aulaNum-1]?.date;
  if(!dateForAula)return[];
  const bench=CPL_BENCHMARK_OUT25?CPL_BENCHMARK_OUT25["aula0"+aulaNum]:null;
  const rows=S.likesRows.filter(r=>r.date===dateForAula).sort((a,b)=>a.time<b.time?-1:1);
  return rows.map(r=>{
    const hour=nearestCplHour(r.time);
    const fatorX=bench?bench[hour]:undefined;
    const meta=fatorX!=null?(fatorX/100)*leadsAoVivo:null;
    return{time:r.time,hourBench:hour,likes:r.likes,fatorX,meta};
  });
}

// ── Load data ─────────────────────────────────────────────────────────────
async function loadData(){
  // Guarda extra: se o funil ativo não tiver sheetId configurado, nem tenta
  // buscar — evita fetch com URL quebrada ("…/d/null/gviz/…").
  if(!SHEET_ID){
    S.error=`Funil "${FUNIS[S.funilAtivo].label}" ainda não tem planilha configurada — passe o link do Google Sheets pra eu conectar (preencher sheetId em FUNIS.tdo).`;
    S.loading=false; render();
    return;
  }
  S.loading=true; S.error=null; render();
  try{
    const [metaCsv, leadsCsv] = await Promise.all([
      fetchSheetCSV(SHEET_META_NAME),
      fetchSheetCSV(SHEET_LEADS_NAME),
    ]);
    const metaRowsRaw = parseRows(parseCSVText(metaCsv));
    const leadsRowsRaw = parseRows(parseCSVText(leadsCsv));

    // ── Base Meta (investimento) ──
    const mD={}, metaRows=[], adIdMap={};
    for(const r of metaRowsRaw){
      const d=toISO(r["Date"]);if(!d)continue;
      const sp=parseBRL(r["Spend (Cost, Amount Spent)"]);
      const cl=parseInt(r["Action Link Clicks"]||0)||0;
      const im=parseInt(r["Impressions"]||0)||0;
      const al=parseInt(r["Action Leads"]||0)||0;
      const vv=parseInt(r["Action Video View"]||0)||0;
      const adId=(r["Ad ID"]||"").trim();
      const adName=(r["Ad Name"]||"").trim();
      const campId=(r["Campaign ID"]||"").trim();
      const campName=(r["Campaign Name"]||"").trim();
      const adsetName=(r["Adset Name"]||"").trim();
      const igUrl=(r["Instagram Permalink URL"]||"").trim();
      const platform=(r["Publisher Platform (Breakdown)"]||"").trim();

      if(!mD[d])mD[d]={spend:0,clicks:0,impressions:0,actionLeads:0,videoViews:0};
      mD[d].spend+=sp;mD[d].clicks+=cl;mD[d].impressions+=im;mD[d].actionLeads+=al;mD[d].videoViews+=vv;

      metaRows.push({date:d,adId,adName,campId,campName,adsetName,spend:sp,clicks:cl,impressions:im,actionLeads:al,videoViews:vv,igUrl,platform,
        temperatureName:campaignTemperature(campName)});

      if(adId&&!adIdMap[adId])adIdMap[adId]={adName,campName,campId,adsetName,igUrl};
      if(adId&&igUrl&&!adIdMap[adId].igUrl)adIdMap[adId].igUrl=igUrl;
    }

    // ── Leads reais (Base leads) ──
    // Dedup por telefone/e-mail (mesmo critério das fichas do Carrinho):
    // uma pessoa pode reenviar o formulário mais de uma vez (reabrir a
    // página, refazer o quiz, etc.) e isso infla a contagem de leads. Monta
    // TODAS as linhas primeiro (leadsRowsAll) e só depois de-duplica,
    // mantendo a inscrição mais antiga de cada pessoa — leadsByDate (usado
    // no "leads/dia" do resumo e do planejado x realizado) é contado já em
    // cima da lista deduplicada, não da lista crua.
    const leadsRowsAll=[];
    for(const r of leadsRowsRaw){
      const parsed=toISOLead(r["created_at"]);if(!parsed)continue;
      const {date,ms}=parsed;

      const utmMed=(r["utm_medium"]||"").trim();
      const utmCont=(r["utm_content"]||r["utm_term"]||"").trim();
      const rawAdId=extractIdSuffix(utmCont);
      const rawAdName=extractNamePrefix(utmCont);
      const rawCampName=extractNamePrefix(utmMed);

      let adName=rawAdName, campName=rawCampName;
      if(rawAdId&&adIdMap[rawAdId]){
        adName=adIdMap[rawAdId].adName||rawAdName;
        campName=adIdMap[rawAdId].campName||rawCampName;
      }
      if(!adName)adName="(sem atribuição)";
      if(!campName)campName="(sem atribuição)";

      // ── Canal (Tráfego × Orgânico) ──────────────────────────────────────
      // Critério pelo utm_source:
      //  • começa com "FBAds"  → Tráfego (Meta Ads, com UTM reconhecida)
      //  • vazio/em branco     → Tráfego sem UTM (ainda é tráfego pago — só
      //                          não veio com o parâmetro, por falha de
      //                          tracking; não é orgânico)
      //  • qualquer outro valor → Orgânico (fonte com nome próprio, ainda não
      //                          vista nesta base — ex.: disparo/lista/bio)
      // Hoje (02/08/26) a base só tem FBAds_* e vazio, então "organico"
      // fica em 0 até aparecer um utm_source de fato orgânico nos dados.
      const platformName=(r["platform_name"]||"").trim();
      const utmSourceRaw=(r["utm_source"]||"").trim();
      const hasUtm=utmSourceRaw.length>0;
      const channel=(!hasUtm||utmSourceRaw.startsWith("FBAds"))?"trafego":"organico";
      const scoreQuiz=scoreLead(r);

      leadsRowsAll.push({
        date,ms,
        path:(r["path"]||"").trim(), // página onde a lead se cadastrou (bate com "Page Path" da Base GA4)
        quizOk:(r["Quiz respondido?"]||"").trim()==="Sim",
        // faixa/score recalculados aqui (ver scoreLead/faixaFromScore) —
        // as colunas "faixa" e "score_total" da planilha são ignoradas.
        faixa:faixaFromScore(scoreQuiz),
        score:scoreQuiz,
        name:(r["name"]||"").trim(),
        email:normalizeEmail(r["person_email"]), // já normalizado — usado tb como chave de dedup
        phone:normalizePhone(r["person_phone"]), // já normalizado — usado tb como chave de dedup
        utmSource:(r["utm_source"]||"").trim()||"(direto/sem utm)",
        platformName,channel,hasUtm,
        temperatureName:campaignTemperature(campName),
        // % conhece o Ramon — lê a coluna da pesquisa na Base leads. Se o
        // cabeçalho na planilha do tdo_ago26 for diferente do texto abaixo,
        // é só trocar a string pelo nome exato da coluna (o resto do código
        // é null-safe: sem a coluna, o KPI aparece como "—").
        conheceRamon:(r["Você conhece o Ramon Galimberti?"]||"").trim(),
        conheceAD:(r["Você conhece a Aliança Divergente?"]||"").trim(),
        adName,campName,
        idade:(r["Em qual faixa etária você se encaixa?"]||"").trim(),
        escolaridade:(r["Qual é o seu nível de escolaridade?"]||"").trim(),
        sexo:(r["Qual seu sexo?"]||"").trim(),
        estadoCivil:(r["Qual seu estado civil?"]||"").trim(),
        filhos:(r["Você tem filhos?"]||"").trim(),
        renda:(r["Qual das opções representa a sua renda mensal hoje?"]||"").trim(),
        trabalho:(r["Você trabalha como (marque o trabalho que te gera mais renda):"]||"").trim(),
        // 3 perguntas da pesquisa usadas na aba Análise qualificação (e no
        // score/faixa) — nomes de coluna reaproveitados de SCORE_COLS.
        solidao:(r[SCORE_COLS.solidao]||"").trim(),
        terapia:(r[SCORE_COLS.terapia]||"").trim(),
        eficaz:(r[SCORE_COLS.eficaz]||"").trim(),
      });
    }
    const leadsRows=dedupByContact(leadsRowsAll);
    const leadsByDate={};
    for(const l of leadsRows)leadsByDate[l.date]=(leadsByDate[l.date]||0)+1;

    S.meta=mD; S.metaRows=metaRows; S.adIdMap=adIdMap;
    S.leadsRows=leadsRows; S.leadsRowsRaw=leadsRowsAll; S.leadsByDate=leadsByDate;

    const allDates=[...new Set([...Object.keys(mD),...Object.keys(leadsByDate)])].sort();
    S.updated=allDates.length?fDateBR(allDates[allDates.length-1]):"—";

    if(!S.startDate){
      const first=allDates[0]||todayISO();
      S.startDate=first;S.endDate=todayISO();S.activeQuick="";
      // se o período de dados for curto, usa preset compatível; senão fica no range completo
      if(first>=nDaysAgoISO(29)){S.startDate=nDaysAgoISO(29);S.activeQuick="30d";}
    }
  }catch(e){
    S.error="Erro ao carregar dados do Google Sheets: "+e.message;
    console.error(e);
  }

  // A partir daqui o essencial (Captação) já está pronto — libera a tela.
  // As seções abaixo (etapas, Carrinho, GA4) são buscadas EM PARALELO e SEM
  // bloquear esse loading, cada uma no seu próprio try/catch: se uma aba
  // travar, atrasar ou não existir, o resto do dashboard (que já está de
  // pé) continua normal — só a seção daquela aba demora um pouco mais pra
  // aparecer, em vez de prender o "Carregando dados…" pra sempre.
  S.loading=false;
  render();

  // Etapas Aquecimento/Lembrete/Aulas.
  (async()=>{
    try{
      const [aquecimentoCsv, lembreteCsv, aulasCsv] = await Promise.all([
        fetchSheetCSV(SHEET_AQUECIMENTO_NAME),
        fetchSheetCSV(SHEET_LEMBRETE_NAME),
        fetchSheetCSV(SHEET_AULAS_NAME),
      ]);
      S.aquecimentoRows = parseStageRows(parseRows(parseCSVText(aquecimentoCsv)));
      S.lembreteRows = parseStageRows(parseRows(parseCSVText(lembreteCsv)));
      S.aulasRows = parseStageRows(parseRows(parseCSVText(aulasCsv)));
      render();
    }catch(e){
      console.error("Erro ao carregar dados das etapas (Aquecimento/Lembrete/Aulas):",e);
    }
  })();

  // Fichas + Vendas do Carrinho (a Vendas depende das Fichas já processadas,
  // por isso fica encadeada dentro do mesmo bloco — mas o bloco inteiro roda
  // à parte do resto).
  (async()=>{
    try{
      const [trafCsv, orgCsv, dispCsv] = await Promise.all([
        fetchSheetCSV(SHEET_CARRINHO_TRAFEGO_NAME),
        fetchSheetCSV(SHEET_CARRINHO_ORGANICO_NAME),
        fetchSheetCSV(SHEET_CARRINHO_DISPARO_NAME),
      ]);
      processCarrinhoFichas(
        parseRows(parseCSVText(trafCsv)),
        parseRows(parseCSVText(orgCsv)),
        parseRows(parseCSVText(dispCsv)),
      );
      render();
    }catch(e){
      console.error("Erro ao carregar fichas do Carrinho (Tráfego/Orgânico/Disparo):",e);
      return;
    }
    try{
      const vendasCsv = await fetchSheetCSV(SHEET_CARRINHO_VENDAS_NAME);
      processCarrinhoVendas(parseRows(parseCSVText(vendasCsv)));
      render();
    }catch(e){
      console.error("Erro ao carregar vendas do Carrinho (Base vendas):",e);
    }
  })();

  // Base GA4 (dados de página) — usada pra Connect Rate e Tx conv Pg
  // cadastro reais.
  (async()=>{
    try{
      const ga4Csv = await fetchSheetCSV(SHEET_GA4_NAME);
      S.ga4Rows = processGA4(parseRows(parseCSVText(ga4Csv)));
      render();
    }catch(e){
      console.error("Erro ao carregar dados de página (Base GA4):",e);
    }
  })();

  // Contagem de likes (YouTube) — Lembrete + CPLs, comparado ao benchmark
  // definido (fator X × leads ao vivo) quando houver — ver LEMBRETE_BENCHMARK_OUT25/CPL_BENCHMARK_OUT25.
  (async()=>{
    try{
      const likesCsv = await fetchSheetCSV(SHEET_LIKES_NAME);
      S.likesRows = processLikes(parseRows(parseCSVText(likesCsv)));
      render();
    }catch(e){
      console.error("Erro ao carregar Contagem likes:",e);
    }
  })();
}

// ── Derived metrics ───────────────────────────────────────────────────────
// channel: "total" (tudo) | "trafego" (platform_name=Meta) | "organico" (sem UTM)
// Investimento só existe pro tráfego pago (é a única fonte de custo na Base
// Meta) — em "organico" o investimento é sempre 0; em "total" soma-se todo o
// gasto (blended) contra o total de leads (tráfego + orgânico).
function leadsForChannel(rows,channel){
  if(!channel||channel==="total")return rows;
  return rows.filter(l=>l.channel===channel);
}
// temp: "todos" | "quente" | "morno" | "frio" — comparado com a temperatura
// extraída do NOME DA CAMPANHA (ver campaignTemperature), tanto nos leads
// quanto nas linhas da Base Meta — isso permite filtrar investimento também,
// já que cada campanha do Meta Ads já nasce com a temperatura no nome.
function leadsForTemp(rows,temp){
  if(!temp||temp==="todos")return rows;
  const map={quente:"Quente",morno:"Morno",frio:"Frio"};
  return rows.filter(l=>l.temperatureName===map[temp]);
}
function sumMetaRows(rows){
  return rows.reduce((a,r)=>({spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,actionLeads:a.actionLeads+r.actionLeads}),
    {spend:0,clicks:0,impressions:0,actionLeads:0});
}
// start/end = null → sem limite naquele lado (mesma convenção de leadsInRange)
function metaRowsFiltered(start,end,temp){
  let rows=S.metaRows.filter(r=>(start===null||r.date>=start)&&(end===null||r.date<=end));
  if(temp&&temp!=="todos"){
    const map={quente:"Quente",morno:"Morno",frio:"Frio"};
    rows=rows.filter(r=>r.temperatureName===map[temp]);
  }
  return rows;
}
function getDaily(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const m=sumMetaRows(metaRowsFiltered(date,date,temp));
    const dayLeadsAll=S.leadsRows.filter(l=>l.date===date);
    const leads=leadsForTemp(leadsForChannel(dayLeadsAll,channel),temp).length;
    // GAP usa leads TOTAIS (sem dedup) — o gerenciador do Meta (actionLeads)
    // também não deduplica por contato, então comparar contra a contagem já
    // deduplicada infla o GAP artificialmente. O gráfico de volume continua
    // mostrando "leads" (deduplicado) normalmente — só o GAP muda a base.
    const dayLeadsAllRaw=S.leadsRowsRaw.filter(l=>l.date===date);
    const leadsTotal=leadsForTemp(leadsForChannel(dayLeadsAllRaw,channel),temp).length;
    const spend=channel==="organico"?0:m.spend;
    const actionLeads=m.actionLeads||0;
    // GAP % = diferença entre o que o gerenciador (Meta) reportou e os leads
    // totais da planilha (sem dedup), relativa aos leads totais. Positivo =
    // Meta reportou mais leads do que realmente caíram na planilha
    // (duplicidade/atraso etc).
    const gapPct=leadsTotal>0?((actionLeads-leadsTotal)/leadsTotal)*100:null;
    return{date,label:fDate(date),spend,leads,actionLeads,gapPct,
      cpl:leads>0?spend/leads:0};
  });
}
// Séries diárias de qualidade (faixa/quiz/conhece Ramon-AD), % sempre sobre
// quem respondeu naquele dia especificamente (dias com poucos respondentes
// podem oscilar bastante — é esperado).
function getDailyQuality(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const q=qualityMetrics(date,date,channel,temp);
    return{date,label:fDate(date),...q};
  });
}
function getTotals(daily){
  return daily.reduce((a,d)=>({spend:a.spend+d.spend,leads:a.leads+d.leads}),{spend:0,leads:0});
}
// Investimento/leads/custo-lead da aba Principal, considerando os filtros de
// canal e temperatura. OBS: investimento/CPC/CTR/CPM só reagem ao canal — a
// Base Meta não segmenta gasto por temperatura de público, então filtrar por
// temperatura só restringe a contagem de leads/qualidade, não o investimento.
function principalTotals(start,end,channel,temp="todos"){
  // Gasto/cliques/impressões filtrados pela temperatura da campanha (nome da
  // campanha já indica quente/morno/frio) — não é mais um "blended" único.
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const leads=rows.length;
  const spend=channel==="organico"?0:m.spend;
  const cpl=(spend>0&&leads>0)?spend/leads:null;
  return{spend,leads,cpl,clicks:m.clicks,impressions:m.impressions,actionLeads:m.actionLeads};
}
// % de faixa/quiz/conhece-Ramon/conhece-AD — sempre sobre quem respondeu
// (não-resposta não entra no denominador), exceto a própria taxa de resposta
// do quiz, cujo denominador é o total de leads do canal/período.
function qualityMetrics(start,end,channel,temp="todos"){
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const total=rows.length;
  const quizRows=rows.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  const faixaPct=f=>quizRows.length>0?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  const faixaPcts=Object.fromEntries(FAIXA_LETTERS.map(l=>[FAIXA_FIELD_KEY[l],faixaPct(l)]));
  const ramonRows=rows.filter(l=>l.conheceRamon==="Sim"||l.conheceRamon==="Não");
  const ramonPct=ramonRows.length>0?(ramonRows.filter(l=>l.conheceRamon==="Sim").length/ramonRows.length)*100:null;
  const adRows=rows.filter(l=>l.conheceAD==="Sim"||l.conheceAD==="Não");
  const adPct=adRows.length>0?(adRows.filter(l=>l.conheceAD==="Sim").length/adRows.length)*100:null;
  return{total,quizRespondidoN:quizRows.length,quizPct,
    ...faixaPcts,
    ramonPct,ramonN:ramonRows.length,adPct,adN:adRows.length};
}
function fPctOrDash(v){ return v==null?"—":fPct(v); }
// Pacote de métricas usado no Resumo diário: sempre "total" (tráfego+orgânico),
// pois o resumo consolidado do lançamento não segmenta por canal.
function resumoMetrics(s,e){
  const per=periodTotals(s,e);
  // TODAS as métricas de qualidade do Resumo diário são calculadas SÓ sobre
  // leads de TRÁFEGO (faixas, % quente+morno, tx de resposta da pesquisa,
  // conhece Ramon/AD). Orgânico fica de fora do numerador e do denominador —
  // antes o canal era "total" e as faixas não batiam com a aba de Captação
  // filtrada por tráfego. As linhas "Cadastros no AC Orgânico/Total"
  // continuam existindo, mas são só contagem informativa.
  const qm=qualityMetrics(s,e,"trafego");
  const rowsAll=leadsInRange(s,e);
  const rows=leadsForChannel(rowsAll,"trafego");
  const leadsTrafego=rows.length;
  const leadsOrganico=leadsForChannel(rowsAll,"organico").length;
  const quenteMornoRows=rows.filter(l=>l.temperatureName==="Quente"||l.temperatureName==="Morno");
  const quenteMornoPct=rows.length>0?(quenteMornoRows.length/rows.length)*100:null;
  // Tx conv Pg cadastro: leads de tráfego ÷ sessões da página de captura
  // (Base GA4, só FBAds — exclusão da página de pesquisa/quiz pendente).
  // SEM fallback aqui (diferente de trafficMetrics/Métricas de Tráfego): o
  // Resumo diário usa só dado real do GA4 — fica "—" quando não há sessão
  // no período, em vez de aproximar por cliques.
  const ga4=ga4Metrics(s,e,"todos");
  const txConvPg=ga4.sessions>0?(leadsTrafego/ga4.sessions)*100:null;
  // Connect Rate: sessões (GA4) ÷ cliques no link (Meta Ads).
  const connectRate=(per.clicks>0&&ga4.sessions>0)?(ga4.sessions/per.clicks)*100:null;
  // Custo por cadastro AC Tráfego: todo o gasto é pago (tráfego), então o
  // custo/lead "oficial" da meta é sobre os cadastros de tráfego — não o
  // blended (que dilui com orgânico, hoje sempre 0 leads).
  const cpl=leadsTrafego>0?per.spend/leadsTrafego:null;
  return{...per,...qm,leadsTrafego,leadsOrganico,cpl,quenteMornoPct,quenteMornoN:quenteMornoRows.length,txConvPg,connectRate};
}
// s,e = null → todo o período (all-time)
function periodTotals(s,e){
  const dates=new Set([...Object.keys(S.leadsByDate),...Object.keys(S.meta)]);
  let leads=0,spend=0,clicks=0,impressions=0,actionLeads=0;
  for(const d of dates){
    if(s!==null&&d<s)continue;
    if(e!==null&&d>e)continue;
    leads+=S.leadsByDate[d]||0;
    const m=S.meta[d];
    if(m){ spend+=m.spend||0; clicks+=m.clicks||0; impressions+=m.impressions||0; actionLeads+=m.actionLeads||0; }
  }
  return{leads,spend,clicks,impressions,actionLeads,
    cpl:leads>0?spend/leads:0,
    cpc:clicks>0?spend/clicks:0,
    ctr:impressions>0?(clicks/impressions)*100:0,
    cpm:impressions>0?(spend/impressions)*1000:0};
}
// start/end = null → sem limite naquele lado (usado pelo "Total - Consolidado")
function leadsInRange(start,end){
  return S.leadsRows.filter(l=>(start===null||l.date>=start)&&(end===null||l.date<=end));
}
// Mesma coisa que leadsInRange, mas sobre a lista SEM dedup — só usado pra
// mostrar "leads totais" (toda submissão, mesmo repetida) ao lado do número
// de leads únicas na aba Principal (ver kpiCard "Leads captados").
function leadsInRangeRaw(start,end){
  return S.leadsRowsRaw.filter(l=>(start===null||l.date>=start)&&(end===null||l.date<=end));
}
// ── Campanhas / Anúncios: agregação com cross-filtering ───────────────────
function getMetaRowsInRange(start,end){
  return S.metaRows.filter(r=>r.date>=start&&r.date<=end);
}
function getLeadsRowsForCamp(start,end,campName){
  return S.leadsRows.filter(l=>l.date>=start&&l.date<=end&&l.campName===campName);
}
// Mesma coisa, mas na base SEM dedup — usada só pro GAP: o gerenciador do
// Meta (actionLeads) não deduplica por contato, então comparar contra a
// contagem já deduplicada infla o GAP artificialmente. Mesmo critério do
// GAP diário da aba Principal (ver getDaily).
function getLeadsRawForCamp(start,end,campName){
  return S.leadsRowsRaw.filter(l=>l.date>=start&&l.date<=end&&l.campName===campName);
}
function getLeadsRowsForAd(start,end,adName,campFilter){
  return S.leadsRows.filter(l=>{
    if(l.date<start||l.date>end)return false;
    if(l.adName!==adName)return false;
    if(campFilter&&campFilter.size>0&&!campFilter.has(l.campName))return false;
    return true;
  });
}
// % faixa (sobre quem respondeu o quiz) + % resposta da pesquisa (sobre todos
// os leads daquela campanha/anúncio) — mesma convenção usada na aba Principal.
function qualityFromLeadsArray(leadsArr){
  const total=leadsArr.length;
  const quizRows=leadsArr.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  const faixaPct=f=>quizRows.length>0?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  const faixaPcts=Object.fromEntries(FAIXA_LETTERS.map(l=>[FAIXA_FIELD_KEY[l],faixaPct(l)]));
  return{quizPct,...faixaPcts};
}
// Célula do GAP na tabela de campanhas: verde até 10%, amarelo de 10% a 20%,
// vermelho acima de 20% — quanto MENOR o GAP, melhor (gerenciador e planilha
// batendo). Negativo (planilha com mais leads que o gerenciador) é tratado
// pelo módulo: o que importa é a distância de zero. O title do <td> mostra a
// conta por trás (gerenciador × planilha sem dedup).
function gapTd(gapPct,actionLeads,leadsRaw){
  if(gapPct==null)return `<td class="mono" style="text-align:right;color:var(--hint)">—</td>`;
  const abs=Math.abs(gapPct);
  const cor=abs<=10?"#34d399":abs<=20?"#fbbf24":"#f87171";
  const sinal=gapPct>0?"+":"";
  return `<td class="mono" style="text-align:right;color:${cor}" title="gerenciador: ${actionLeads} · planilha (sem dedup): ${leadsRaw}">${sinal}${fPct(gapPct)}</td>`;
}
function getCampRows(start,end){
  const rows=getMetaRowsInRange(start,end);
  const byCamp={};
  for(const r of rows){
    const cn=r.campName||"(sem campanha)";
    if(!byCamp[cn])byCamp[cn]={campName:cn,spend:0,clicks:0,impressions:0,actionLeads:0};
    byCamp[cn].spend+=r.spend;byCamp[cn].clicks+=r.clicks;byCamp[cn].impressions+=r.impressions;byCamp[cn].actionLeads+=r.actionLeads;
  }
  return Object.values(byCamp).map(c=>{
    const leadsArr=getLeadsRowsForCamp(start,end,c.campName);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    // GAP % = (leads do gerenciador − leads reais sem dedup) ÷ leads reais.
    // Positivo = o Meta reportou mais do que caiu na planilha. null quando
    // não há lead real no período (divisão por zero).
    const leadsRaw=getLeadsRawForCamp(start,end,c.campName).length;
    const gapPct=leadsRaw>0?((c.actionLeads-leadsRaw)/leadsRaw)*100:null;
    return {...c,leads,leadsRaw,gapPct,...q,
      cpc:c.clicks>0?c.spend/c.clicks:0, ctr:c.impressions>0?(c.clicks/c.impressions)*100:0,
      cpm:c.impressions>0?(c.spend/c.impressions)*1000:0, cpl:leads>0?c.spend/leads:0};
  });
}
function getAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=getMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName));
  const byAd={};
  for(const r of rows){
    const an=r.adName||"(sem anúncio)";
    if(!byAd[an])byAd[an]={adName:an,spend:0,clicks:0,impressions:0,actionLeads:0,igUrl:"",camps:new Set()};
    byAd[an].spend+=r.spend;byAd[an].clicks+=r.clicks;byAd[an].impressions+=r.impressions;byAd[an].actionLeads+=r.actionLeads;
    if(!byAd[an].igUrl&&r.igUrl)byAd[an].igUrl=r.igUrl;
    if(r.campName)byAd[an].camps.add(r.campName);
  }
  return Object.values(byAd).map(a=>{
    const leadsArr=getLeadsRowsForAd(start,end,a.adName,hasSel?selectedCamps:null);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    return {...a,leads,...q,campNames:[...a.camps].join(", "),
      cpc:a.clicks>0?a.spend/a.clicks:0, ctr:a.impressions>0?(a.clicks/a.impressions)*100:0,
      cpm:a.impressions>0?(a.spend/a.impressions)*1000:0, cpl:leads>0?a.spend/leads:0};
  });
}

function applyQuickCurrent(k){
  const t=todayISO();
  const map={hoje:()=>({s:t,e:t}),ontem:()=>{const y=yesterdayISO();return{s:y,e:y}},
    "7d":()=>({s:nDaysAgoISO(6),e:t}),"30d":()=>({s:nDaysAgoISO(29),e:t}),mes:()=>({s:firstOfMonthISO(),e:t})};

  S.startDate=r.s;S.endDate=r.e;S.activeQuick=k;render();

const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  cssW=Math.max(cssW,50);cssH=Math.max(cssH,50);
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);

    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();

function drawBarWithGap(id,data,barKey,gapKey,barColor,gapColor,cssW,cssH,showGap){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;

  }
  drawBars(ctx,xP,yP,P.t+cH,vals,barColor,barW);
  const step=n>60?7:n>30?3:n>14?2:1;

  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){

      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  if(showGap){
    const gapVals=data.map(d=>d[gapKey]==null?0:d[gapKey]);
    const rMin=Math.min(0,...gapVals)*1.15;
    const rMax=Math.max(...gapVals,1)*1.15;

    if(rMin<0){
      const zY=yPR(0);
      ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=1;ctx.setLineDash([3,3]);

    drawLineArea(ctx,xP,yPR,gapVals,gapColor,false);
  }
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
