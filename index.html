// Múltiplas linhas de % (0-100) — usado nas séries diárias de qualidade
// (Faixa A+/A/B/C/D/E, Conhece Ramon/AD). Pontos nulos (sem resposta no dia) quebram
// a linha em vez de cair pra zero.
// showLabels=true escreve o valor (%) de cada ponto em cima da linha — usado
// no gráfico "% Faixa por dia" pra bater o olho sem precisar passar o mouse.
// Cada série pode opcionalmente trazer `meta` (número 0-100), que desenha uma
// linha tracejada horizontal na cor da série (mesmo padrão do drawMetricLine).
function drawMultiLine(id,data,series,cssW,cssH,showLabels=false){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:36};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,Math.min(100,v))/100)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText((100-(i/4)*100).toFixed(0)+"%",P.l-4,y+3);
  }
  series.forEach(s=>{
    if(s.meta==null)return;
    const mY=yP(s.meta);
    ctx.strokeStyle=s.color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
  });
  series.forEach(s=>{
    const vals=data.map(d=>d[s.key]);
    ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.setLineDash([]);
    let started=false;
    vals.forEach((v,i)=>{
      if(v==null){started=false;return;}
      if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
      else ctx.lineTo(xP(i),yP(v));
    });
    ctx.stroke();
    vals.forEach((v,i)=>{
      if(v==null)return;
      ctx.beginPath();ctx.fillStyle=s.color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
    });
    if(showLabels){
      ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
      vals.forEach((v,i)=>{
        if(v==null)return;
        const y=yP(v),hasRoom=y-P.t>13;
        ctx.fillStyle=s.color;
        ctx.fillText(v.toFixed(0)+"%",xP(i),y+(hasRoom?-6:13));
      });
    }
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      const _v=d[l.key];
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${_v==null?"—":(l.fmt||fBRL)(+_v)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

function renderPrincipal(){

  const ga4PageTotal=ga4PageRows.reduce((a,p)=>({sessions:a.sessions+p.sessions,cadastros:a.cadastros+p.cadastros}),{sessions:0,cadastros:0});
  const ga4PageTotalConv=ga4PageTotal.sessions>0?(ga4PageTotal.cadastros/ga4PageTotal.sessions)*100:null;

  // Plano (aba Planejamento → Captação) até hoje, pra preencher "planejado
  // até hoje" e "% atingimento" — comparação é sempre contra o total (o plano
  // não segmenta por canal/temperatura), então usa pt.leads/pt.spend do
  // canal+temperatura selecionados contra a meta do lançamento inteiro.
  const plano=planoAteHoje();
  const pctAtingimento=plano.leads>0?(pt.leads/plano.leads)*100:null;
  const investPlanoColor=plano.investimento>0?statusColor(pt.spend,plano.investimento,false):"var(--text-strong)";
  const leadsPlanoColor=plano.leads>0?statusColor(pt.leads,plano.leads,true):"var(--text-strong)";

  // Faixa: sem meta definida ainda (6 tiers A+/A/B/C/D/E) — metaCfg é null até
  // as novas metas serem passadas em METAS_RESUMO (ver comentário lá).
  function faixaCard(lbl,val,metaCfg){
    const c=(val!=null&&metaCfg)?statusColor(val,metaCfg.val,metaCfg.higher):"var(--text-strong)";
    return kpiCard(lbl,fPctOrDash(val),val==null?"sem resposta no período":(metaCfg?`meta ${metaCfg.val}%`:"sem meta ainda"),c,false,val,metaCfg?metaCfg.val:null,metaCfg?metaCfg.higher:null);
  }
  const quizC=qm.quizPct!=null?statusColor(qm.quizPct,METAS_RESUMO.quiz.val,METAS_RESUMO.quiz.higher):"var(--text-strong)";
  const ramonC=qm.ramonPct!=null?statusColor(qm.ramonPct,METAS_RESUMO.ramon.val,METAS_RESUMO.ramon.higher):"var(--text-strong)";
  const adC=qm.adPct!=null?statusColor(qm.adPct,METAS_RESUMO.ad.val,METAS_RESUMO.ad.higher):"var(--text-strong)";

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">TDO — Captação de Leads</div>
        <div class="hdr-sub">atualizado em: ${S.updated||"—"}${daily.length>0?` · ${daily.length} dias no período`:""} · canal: ${chLabel} · temperatura: ${tempLabel}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">${statusLegend()}</div>
    </div>
    <div style="margin-bottom:14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Canal:</span>${channelToggle()}</div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Temperatura:</span>${tempToggle()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div class="g3" style="margin-bottom:13px">
      ${kpiCard("Investimento",fBRL(pt.spend),ch==="organico"?"sem tráfego pago":`planejado até hoje: ${fBRL(plano.investimento)}`,ch==="organico"?"var(--text-strong)":investPlanoColor,false,ch==="organico"?null:pt.spend,plano.investimento>0?plano.investimento:null,false)}
      ${kpiCard("Leads captados",pt.leads.toLocaleString("pt-BR"),`atingimento da meta: ${pctAtingimento!=null?fPct(pctAtingimento):"—"}${plano.leads>0?` (${pt.leads}/${plano.leads} planejados)`:""}${ch!=="organico"&&semUtmN>0?` · ${semUtmN} sem UTM`:""} · ${leadsTotalRaw.toLocaleString("pt-BR")} leads totais (sem dedup)`,leadsPlanoColor,false,plano.leads>0?pt.leads:null,plano.leads>0?plano.leads:null,true)}
      ${kpiCard("Custo/lead",pt.cpl!=null?fBRL(pt.cpl):"—",pt.cpl!=null?`meta ${fBRL(META_CPL)}`:"não aplicável",cplC,false,pt.cpl,META_CPL,false)}
    </div>

    <div class="g6" style="margin-bottom:13px">
      ${faixaCard("% Faixa A+",qm.faixaAplus,METAS_RESUMO.faixaAplus)}
      ${faixaCard("% Faixa A",qm.faixaA,METAS_RESUMO.faixaA)}
      ${faixaCard("% Faixa B",qm.faixaB,METAS_RESUMO.faixaB)}
      ${faixaCard("% Faixa C",qm.faixaC,METAS_RESUMO.faixaC)}
      ${faixaCard("% Faixa D",qm.faixaD,METAS_RESUMO.faixaD)}
      ${faixaCard("% Faixa E",qm.faixaE,METAS_RESUMO.faixaE)}
    </div>

    <div class="g3" style="margin-bottom:16px">
      ${kpiCard("% resposta da pesquisa",fPctOrDash(qm.quizPct),`${qm.quizRespondidoN} de ${qm.total} · meta ${METAS_RESUMO.quiz.val}%`,quizC,false,qm.quizPct,METAS_RESUMO.quiz.val,METAS_RESUMO.quiz.higher)}
      ${kpiCard("% conhece o Ramon",fPctOrDash(qm.ramonPct),`${qm.ramonN} respostas · ${metaSub(METAS_RESUMO.ramon)}`,ramonC,false,qm.ramonPct,METAS_RESUMO.ramon.val,METAS_RESUMO.ramon.higher)}
      ${kpiCard("% conhece a Aliança Divergente",fPctOrDash(qm.adPct),`${qm.adN} respostas · ${metaSub(METAS_RESUMO.ad)}`,adC,false,qm.adPct,METAS_RESUMO.ad.val,METAS_RESUMO.ad.higher)}
    </div>

    <div class="section-lbl" style="margin-top:0">% Faixa A+/A/B/C/D/E e conhece Ramon/AD: calculadas só sobre quem respondeu cada pergunta (não-resposta fica fora do denominador). Metas de faixa (6 tiers) já definidas pro tdo_ago26; "conhece Ramon" e "conhece AD" ainda sem meta.</div>

    ${ch!=="organico"?`
    <div class="cc" style="margin-bottom:12px;position:relative">
      <div class="ch">
        <span class="ct">Investimento × Custo por Lead</span>
        <div class="lg">
          <span class="li"><span class="ll" style="background:${CHART_INV}"></span>Invest. (esq.)</span>
          <span class="li"><span class="ll" style="background:${CHART_CPL}"></span>Custo/lead (dir.)</span>
          <span class="li"><span class="ll" style="background:${CHART_CPL};opacity:.4;border-top:1px dashed ${CHART_CPL}"></span>Meta R$${META_CPL}</span>
        </div>
      </div>
      <div style="position:relative"><canvas id="c-dual"></canvas><div class="tip" id="t-dual"></div></div>
    </div>`:""}
    <div class="cc" style="position:relative;margin-bottom:12px">
      <div class="ch">
        <span class="ct">Volume de leads</span>
        <div class="lg">
          <span class="li"><span class="ld" style="background:${CHART_LEAD}"></span>Leads/dia</span>
          ${S.showGapVolume?`<span class="li"><span class="ll" style="background:${CHART_GAP}"></span>GAP % (gerenciador × planilha)</span>`:""}
          <button onclick="toggleGapVolume()" style="font-size:10px;padding:3px 10px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;
            ${S.showGapVolume?`background:rgba(248,113,113,.18);border:1px solid rgba(248,113,113,.4);color:#f87171`:`background:transparent;border:1px solid rgba(248,113,113,.4);color:#f87171`}">
            ${S.showGapVolume?"✕ GAP":"+ GAP"}
          </button>
        </div>
      </div>
      <div style="position:relative"><canvas id="c-leads"></canvas><div class="tip" id="t-leads"></div></div>
      ${S.showGapVolume?`<div style="font-size:10px;color:var(--hint);margin-top:8px">GAP % = (leads reportados pelo gerenciador do Meta − leads reais da planilha) ÷ leads reais. Positivo = gerenciador reportou mais leads do que realmente entraram na planilha.</div>`:""}
    </div>

    <div class="cc" style="position:relative;margin-bottom:12px">
      <div class="ch">
        <span class="ct">% Faixa por dia — ${chLabel} · ${tempLabel}</span>
        <div class="lg">${faixaSelButtons()}</div>
      </div>
      <div style="position:relative"><canvas id="c-faixa"></canvas><div class="tip" id="t-faixa"></div></div>
      ${Object.values(S.faixaSel).every(v=>!v)?`<div style="font-size:10px;color:var(--hint);margin-top:8px">Selecione ao menos uma faixa pra ver a linha no gráfico.</div>`:""}
    </div>

    <div class="cc" style="position:relative">
      <div class="ch">
        <span class="ct">% Conhece Ramon / Aliança Divergente por dia — ${chLabel} · ${tempLabel}</span>
        <div class="lg">
          <span class="li"><span class="ll" style="background:${CHART_RAMON}"></span>Conhece Ramon</span>
          <span class="li"><span class="ll" style="background:${CHART_AD}"></span>Conhece AD</span>
          ${METAS_RESUMO.ramon.val!=null?`<span class="li"><span class="ll" style="background:${CHART_RAMON};opacity:.4;border-top:1px dashed ${CHART_RAMON}"></span>Meta Ramon ${METAS_RESUMO.ramon.val}%</span>`:""}
          ${METAS_RESUMO.ad.val!=null?`<span class="li"><span class="ll" style="background:${CHART_AD};opacity:.4;border-top:1px dashed ${CHART_AD}"></span>Meta AD ${METAS_RESUMO.ad.val}%</span>`:""}
        </div>
      </div>
      <div style="position:relative"><canvas id="c-conhece"></canvas><div class="tip" id="t-conhece"></div></div>
    </div>

    <div class="section-lbl">Página (GA4 · ${fDateBR(S.startDate)} a ${fDateBR(S.endDate)})</div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:6px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Page Path</th>
          <th style="text-align:right">Sessions</th>
          <th style="text-align:right">Cadastros</th>
          <th style="text-align:right">Conversão de página</th>
        </tr></thead>
        <tbody>
          ${ga4PageRows.length===0?`<tr><td colspan="4" style="text-align:center;color:var(--hint);padding:20px">Sem dado de GA4 no período (ou só o dia de hoje, que é sempre desconsiderado)</td></tr>`:
          ga4PageRows.map(p=>`<tr>
            <td>${p.pagePath}</td>
            <td class="mono" style="text-align:right">${p.sessions.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${Math.round(p.cadastros).toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${p.convPagina!=null?fPct(p.convPagina):"—"}</td>
          </tr>`).join("")}
          ${ga4PageRows.length>1?`<tr style="font-weight:700">
            <td>Total</td>
            <td class="mono" style="text-align:right">${ga4PageTotal.sessions.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${Math.round(ga4PageTotal.cadastros).toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${ga4PageTotalConv!=null?fPct(ga4PageTotalConv):"—"}</td>
          </tr>`:""}
        </tbody>
      </table>
      </div>
    </div>

    ${daily.length===0?`<div class="err" style="margin-top:12px">Nenhum dado no período selecionado.</div>`:""}
    <div class="foot">TDO · Captação · dados locais (CSV embutido)</div>`;
  requestAnimationFrame(()=>{
    if(ch!=="organico"){
      const box1=document.getElementById("c-dual")?.parentElement;
      if(box1)drawDualInvCpl("c-dual",daily,box1.clientWidth,220);
      setupTip("c-dual","t-dual",daily,[
        {name:"Investimento",color:CHART_INV,key:"spend",fmt:fBRL},
        {name:"Custo/lead",color:CHART_CPL,key:"cpl",fmt:fBRL}]);
    }
    const box2=document.getElementById("c-leads")?.parentElement;
    if(box2)drawBarWithGap("c-leads",daily,"leads","gapPct",CHART_LEAD,CHART_GAP,box2.clientWidth,200,S.showGapVolume);
    const tipLines=[{name:"Leads",color:CHART_LEAD,key:"leads",fmt:v=>String(v)}];
    if(S.showGapVolume)tipLines.push({name:"GAP %",color:CHART_GAP,key:"gapPct",fmt:v=>fPct(v)});
    setupTip("c-leads","t-leads",daily,tipLines,40,S.showGapVolume?50:12);

    const dailyQ=getDailyQuality(S.startDate,S.endDate,ch,temp);
    const box3=document.getElementById("c-faixa")?.parentElement;
    const faixaSeries=FAIXA_LETTERS.filter(l=>S.faixaSel[l]).map(l=>({key:FAIXA_FIELD_KEY[l],color:CHART_FAIXA[l]}));
    if(box3)drawMultiLine("c-faixa",dailyQ,faixaSeries,box3.clientWidth,220,true);
    setupTip("c-faixa","t-faixa",dailyQ,FAIXA_LETTERS.filter(l=>S.faixaSel[l]).map(l=>
      ({name:"Faixa "+l,color:CHART_FAIXA[l],key:FAIXA_FIELD_KEY[l],fmt:fPctOrDash})),36,12);

    const box4=document.getElementById("c-conhece")?.parentElement;
    if(box4)drawMultiLine("c-conhece",dailyQ,[
      {key:"ramonPct",color:CHART_RAMON,meta:METAS_RESUMO.ramon.val},
      {key:"adPct",color:CHART_AD,meta:METAS_RESUMO.ad.val}],box4.clientWidth,220);
    setupTip("c-conhece","t-conhece",dailyQ,[
      {name:"Conhece Ramon",color:CHART_RAMON,key:"ramonPct",fmt:fPctOrDash},
      {name:"Conhece AD",color:CHART_AD,key:"adPct",fmt:fPctOrDash}],36,12);
  });
}

// ── Render: Campanhas / Anúncios ──────────────────────────────────────────
function chkBox(checked){
  return `<div style="width:16px;height:16px;border-radius:4px;border:2px solid ${checked?"#10b981":"rgba(255,255,255,.2)"};background:${checked?"#10b981":"transparent"};display:flex;align-items:center;justify-content:center;margin:auto">
    ${checked?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L4 7L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}
  </div>`;
}
function adResumoBlock(a){
  const lines=[];
  lines.push(`Nome do ad ⤵️`);
  lines.push(a.adName);
  lines.push(``);
  if(a.igUrl)lines.push(a.igUrl);
  lines.push(`Investimento:\t${fBRL(a.spend)}`);
  lines.push(`Leads:\t${a.leads}`);
  lines.push(`Custo/lead:\t${a.leads>0?fBRL(a.cpl):"—"}`);
  lines.push(``);
  lines.push(`Tx Faixa A+:\t${fPctOrDash(a.faixaAplus)}`);
  lines.push(`Tx Faixa A:\t${fPctOrDash(a.faixaA)}`);
  lines.push(`Tx Faixa B:\t${fPctOrDash(a.faixaB)}`);
  lines.push(`Tx Faixa C:\t${fPctOrDash(a.faixaC)}`);
  lines.push(`Tx Faixa D:\t${fPctOrDash(a.faixaD)}`);
  lines.push(`Tx Faixa E:\t${fPctOrDash(a.faixaE)}`);
  lines.push(`% resposta da pesquisa:\t${fPctOrDash(a.quizPct)}`);
  lines.push(``);
  lines.push(`CPM:\t${fBRL(a.cpm)}`);
  lines.push(`CPC:\t${fBRL(a.cpc)}`);
  lines.push(`CTR:\t${fPct(a.ctr)}`);
  lines.push(`__________________________`);
  return lines.join("\n");
}
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const per=getCurrentPeriod();
  const escName=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  // Célula de % Faixa colorida conforme a meta (mesmo padrão da coluna de
  // Custo/lead) — metaKey é a chave em METAS_RESUMO (faixaAplus/faixaA/...).
  function faixaTd(val,metaKey){
    const meta=METAS_RESUMO[metaKey];
    const color=(val!=null&&meta)?statusColor(val,meta.val,meta.higher):"var(--muted)";
    return `<td class="mono" style="text-align:right;color:${color}">${fPctOrDash(val)}</td>`;
  }

  const campRowsAll=getCampRows(start,end);
  const _cq=S.campSearch.trim().toLowerCase();
  const campRows=_cq?campRowsAll.filter(c=>c.campName.toLowerCase().includes(_cq)):campRowsAll;
  const {col:cCol,dir:cDir}=S.cSort;
  // Ordenação: null vai SEMPRE pro fim, independente da direção. Sem isso o
  // "??0" antigo fazia campanha sem dado (GAP/faixa nulos) aparecer como se
  // fosse zero — ou seja, uma campanha sem nenhuma lead subia pro topo do
  // GAP como se estivesse perfeitamente casada com o gerenciador.
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol],bv=b[cCol];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });

  const adRowsAll=getAdRows(start,end,S.selectedCamps);
  const _aq=S.adSearch.trim().toLowerCase();
  const adRowsF=_aq?adRowsAll.filter(a=>a.adName.toLowerCase().includes(_aq)):adRowsAll;
  const {col,dir}=S.aSort;
  const sortedAds=[...adRowsF].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });

  const tot=campRowsAll.reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,impressions:a.impressions+c.impressions,leads:a.leads+c.leads}),{spend:0,clicks:0,impressions:0,leads:0});
  const totCpl=tot.leads>0?tot.spend/tot.leads:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;

  const selAds=sortedAds.filter(a=>S.selectedAds.has(a.adName));
  const adResumoText=selAds.length>0?selAds.map(a=>adResumoBlock(a)).join("\n"):"";
  el._adResumoText=adResumoText;

  function thC(colKey,lbl,isCamp){
    const aC=isCamp?cCol:col, aD=isCamp?cDir:dir, active=aC===colKey;
    const arrow=active?(aD==="asc"?" ↑":" ↓"):" ↕";
    const fn=isCamp?`sortCampanhas('${colKey}')`:`sortAnuncios('${colKey}')`;
    return `<th onclick="${fn}" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas e anúncios</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${sortedCamps.length} campanhas · ${sortedAds.length} anúncios${S.selectedCamps.size>0?` · filtrado por ${S.selectedCamps.size} campanha(s)`:""}</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Investimento",fBRL(tot.spend),"Base Meta","var(--text-strong)")}
      ${kpiCard("Leads",tot.leads.toLocaleString("pt-BR"),"atribuídos por UTM","var(--text-strong)")}
      ${kpiCard("Custo/lead",totCpl>0?fBRL(totCpl):"—",`meta ${fBRL(META_CPL)}`,totCpl>0?statusColor(totCpl,META_CPL,false):"var(--text-strong)",false,totCpl,META_CPL,false)}
      ${kpiCard("CTR",fPct(totCtr),"","var(--text-strong)")}
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0">Campanhas</div>
      ${S.selectedCamps.size>0?`<button onclick="clearCamps()" style="font-size:10px;padding:3px 9px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#f87171;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Limpar seleção (${S.selectedCamps.size})</button>`:""}
      <span style="font-size:10px;color:var(--hint)">Clique para filtrar os anúncios por campanha</span>
    </div>
    <div style="position:relative;margin-bottom:10px">
      <input oninput="setCampSearch(this.value)" value="${S.campSearch}" placeholder="Buscar campanha…" style="width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box"/>
    </div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:22px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th style="width:36px"></th>
          <th onclick="sortCampanhas('campName')" style="cursor:pointer">Campanha</th>
          ${thC("spend","Investimento",true)}
          ${thC("leads","Leads",true)}
          ${thC("cpl","Custo/lead",true)}
          ${thC("faixaAplus","Tx Faixa A+",true)}
          ${thC("faixaA","Tx Faixa A",true)}
          ${thC("faixaB","Tx Faixa B",true)}
          ${thC("faixaC","Tx Faixa C",true)}
          ${thC("faixaD","Tx Faixa D",true)}
          ${thC("faixaE","Tx Faixa E",true)}
          ${thC("quizPct","% resp. pesquisa",true)}
          ${thC("cpm","CPM",true)}
          ${thC("cpc","CPC",true)}
          ${thC("ctr","CTR",true)}
          ${thC("gapPct","GAP",true)}
        </tr></thead>
        <tbody>
          ${sortedCamps.length===0?`<tr><td colspan="16" style="text-align:center;color:var(--hint);padding:20px">Sem dados de campanhas no período</td></tr>`:
          sortedCamps.map(c=>{
            const sel=S.selectedCamps.has(c.campName);
            return `<tr onclick="toggleCamp('${escName(c.campName)}')" style="cursor:pointer;background:${sel?"rgba(16,185,129,.1)":"transparent"}">
              <td style="text-align:center">${chkBox(sel)}</td>
              <td style="color:${sel?"#10b981":"var(--text)"};font-weight:${sel?600:400}">${c.campName}</td>

// ── Render: Leads (Qualidade) ──────────────────────────────────────────────
function distinctCount(rows,key){
  const c={};
  for(const r of rows){ const v=r[key]||"(não informado)"; c[v]=(c[v]||0)+1; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
function setLeadsChannel(c){ S.leadsChannel=c; renderLeads(); }
function setLeadsTemp(t){ S.leadsTemp=t; renderLeads(); }
function leadsChannelToggle(){
  const CH=[["total","Total"],["trafego","Tráfego"],["organico","Orgânico"]];
  return `<div class="presets">${CH.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsChannel===k?" on":""}" onclick="setLeadsChannel('${k}')">${lbl}</button>`).join("")}</div>`;
}
function leadsTempToggle(){
  const TP=[["todos","Todos"],["quente","Quente"],["morno","Morno"],["frio","Frio"]];
  return `<div class="presets">${TP.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsTemp===k?" on":""}" onclick="setLeadsTemp('${k}')">${lbl}</button>`).join("")}</div>`;
}
function renderLeads(){
  const el=document.getElementById("page-leads");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const per=getCurrentPeriod();
  const ch=S.leadsChannel, temp=S.leadsTemp;
  const chLabel={total:"Total",trafego:"Tráfego",organico:"Orgânico"}[ch];
  const tempLabel={todos:"Todos",quente:"Quente",morno:"Morno",frio:"Frio"}[temp];
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),ch),temp);
  const quizRows=rows.filter(l=>l.quizOk);
  const total=rows.length;
  const quizPct=total>0?(quizRows.length/total)*100:0;

  const faixaOrder=FAIXA_LETTERS;
  const faixaColors=CHART_FAIXA;
  const faixaCounts=faixaOrder.map(f=>({f,n:quizRows.filter(l=>l.faixa===f).length}));

  const origemCounts=distinctCount(rows,"utmSource").slice(0,10);
  const maxOrigem=origemCounts.length?origemCounts[0][1]:1;

  // tip = enunciado completo da pergunta, mostrado no hover — os títulos das
  // 3 tabelas da pesquisa são encurtados pra caber no cabeçalho do bloco.
  function demoBlock(title,key,tip){
    const counts=distinctCount(quizRows,key).slice(0,8);
    const maxV=counts.length?counts[0][1]:1;
    return `<div class="cc">
      <div class="ch"><span class="ct"${tip?` title="${tip.replace(/"/g,"&quot;")}" style="cursor:help;border-bottom:1px dotted var(--hint)"`:""}>${title}</span></div>
      ${counts.map(([k,n])=>barRow(k,n,quizRows.length,"#60a5fa")).join("")}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Análise qualificação</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${total} leads no período · canal: ${chLabel} · temperatura: ${tempLabel}</div>
      </div>
    </div>
    <div style="margin-bottom:14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Canal:</span>${leadsChannelToggle()}</div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Temperatura:</span>${leadsTempToggle()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Leads no período",total.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("Quiz respondido",fPct(quizPct),`${quizRows.length} de ${total}`,"var(--text-strong)")}
      ${kpiCard(`Faixa ${faixaCounts[0].f} (melhor score)`,faixaCounts[0].n.toLocaleString("pt-BR"),quizRows.length>0?fPct((faixaCounts[0].n/quizRows.length)*100):"—",CHART_FAIXA[faixaCounts[0].f])}
      ${kpiCard(`Faixa ${faixaCounts[faixaCounts.length-1].f} (pior score)`,faixaCounts[faixaCounts.length-1].n.toLocaleString("pt-BR"),quizRows.length>0?fPct((faixaCounts[faixaCounts.length-1].n/quizRows.length)*100):"—",CHART_FAIXA[faixaCounts[faixaCounts.length-1].f])}

      <div class="cc">

        ${faixaCounts.map(({f,n})=>barRow("Faixa "+f,n,quizRows.length,faixaColors[f])).join("")}
      </div>
      <div class="cc">
        <div class="ch"><span class="ct">Origem (utm_source)</span></div>
        ${origemCounts.map(([k,n])=>barRow(k,n,maxOrigem>0?rows.length:0,"#a78bfa")).join("")}
      </div>

    <div class="section-lbl">Perfil demográfico (entre quem respondeu o quiz)</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px">

      ${demoBlock("Escolaridade","escolaridade")}
      ${demoBlock("Renda mensal","renda")}
      ${demoBlock("Ocupação","trabalho")}
      ${demoBlock("Sente sozinho?","solidao",SCORE_COLS.solidao)}
      ${demoBlock("Já buscou ajuda","terapia",SCORE_COLS.terapia)}
      ${demoBlock("Método foi eficaz?","eficaz",SCORE_COLS.eficaz)}
    </div>
    <div class="foot">TDO · Captação · dados locais (CSV embutido)</div>`;
}

// comparar Ontem/Hoje contra a linha daquele dia na planilha de planejamento.
// Retorna null se a data estiver fora do período planejado (ex.: antes do

function planForDate(dateISO){
  return PLANO_DIARIO.find(p=>p.date===dateISO)||null;
}
// Meta total do lançamento (soma do plano inteiro, não só até hoje) — usada
// só pro "% de atingimento" do bloco Total-Consolidado do Resumo diário.
function planoTotalLancamento(){
  return{
    investimento:PLANO_DIARIO.reduce((a,p)=>a+p.investimento,0),
    leads:PLANO_DIARIO.reduce((a,p)=>a+p.leads,0),
  };
}

// ── Render: Métricas do Tráfego (placeholder — conteúdo a definir) ─────────
// Métricas de tráfego (CPC/CTR/CPM/Tx Pág→Cadastro/Connect Rate), filtráveis
// só por temperatura (extraída do nome da campanha) — não tem filtro de canal
// porque é tudo tráfego pago (a única fonte de investimento na Base Meta).
function trafficMetrics(start,end,temp){
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const leadsRowsT=leadsForTemp(leadsInRange(start,end),temp);
  const leads=leadsRowsT.length;
  const leadsTrafego=leadsForChannel(leadsRowsT,"trafego").length;
  const cpl=leads>0?m.spend/leads:null;
  const cpc=m.clicks>0?m.spend/m.clicks:null;
  const ctr=m.impressions>0?(m.clicks/m.impressions)*100:null;
  const cpm=m.impressions>0?(m.spend/m.impressions)*1000:null;
  const ga4=ga4Metrics(start,end,temp);
  // Tx Pág → Cadastro: leads de tráfego ÷ sessões da página de captura (Base
  // GA4, só FBAds — exclusão da página de pesquisa/quiz pendente). Cai de volta pra aproximação
  // leads/cliques quando não há dado de GA4 no período (ex.: antes da Base
  // GA4 existir) — txConvPgAprox sinaliza quando é essa aproximação, pra UI
  // avisar que não é o dado real do GA4 (diferente do Resumo diário, que não
  // tem esse fallback).
  const txConvPgAprox=ga4.sessions===0&&m.clicks>0;
  const txConvPg=ga4.sessions>0?(leadsTrafego/ga4.sessions)*100:(m.clicks>0?(leads/m.clicks)*100:null);
  // Connect Rate: sessões da página de captura (GA4) ÷ cliques no link (Meta
  // Ads) — mede quantos de quem clicou no anúncio realmente carregou a
  // página. Só existe quando há dado de GA4 no período.
  const connectRate=(m.clicks>0&&ga4.sessions>0)?(ga4.sessions/m.clicks)*100:null;
  return{spend:m.spend,leads,cpl,cpc,ctr,cpm,txConvPg,txConvPgAprox,connectRate};
}

// Linha única de uma métrica ao longo do tempo, com escala dinâmica (baseada
// no próprio dado + na meta) e linha tracejada de meta — mesmo padrão visual
// do gráfico dual de Investimento×Custo/lead da aba Principal.
function drawMetricLine(id,data,key,color,metaVal,cssW,cssH,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]);
  const validVals=vals.filter(v=>v!=null);
  const maxRaw=Math.max(...validVals,metaVal||0,0.01);
  const max=maxRaw*1.2;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,v)/max)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=yP(metaVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  let started=false;
  vals.forEach((v,i)=>{
    if(v==null){started=false;return;}
    if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
    else ctx.lineTo(xP(i),yP(v));
  });
  ctx.stroke();
  vals.forEach((v,i)=>{
    if(v==null)return;
    ctx.beginPath();ctx.fillStyle=color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Mesma métrica em BARRAS em vez de linha — usado quando o período é curto
// demais (ex.: 1-2 dias, caso das Aulas) e uma linha não mostra nada de
// útil. Mesma grade dinâmica e linha tracejada de meta do drawMetricLine,
// mas com rótulo formatado (fmt) em cima de cada barra em vez do rótulo
// inteiro arredondado do drawBarSingle.
function drawMetricBar(id,data,key,color,metaVal,cssW,cssH,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]);
  const validVals=vals.filter(v=>v!=null);
  const maxRaw=Math.max(...validVals,metaVal||0,0.01);
  const max=maxRaw*1.25;
  const n=data.length;
  const barW=Math.max(10,Math.min(60,(cW/Math.max(n,1))*0.45));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,v)/max)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=yP(metaVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  vals.forEach((v,i)=>{
    if(v==null)return;
    const x=xP(i)-barW/2,y=yP(v),h=Math.max(P.t+cH-y,1);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,h);
  });
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v==null)return;
    ctx.fillStyle="#e8edf6";ctx.font="bold 10px 'DM Mono',monospace";
    ctx.fillText(fmt(v),xP(i),yP(v)-4);
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>ctx.fillText(d.label,xP(i),P.t+cH+18));
}

// Investimento/cliques vêm da MESMA Base Meta - captação, filtrada por
// campanha (via campaignStage==="Carrinho") — o Carrinho não tem uma sheet de
// mídia própria, suas campanhas só se identificam pelo nome, igual às outras
// etapas. Fichas vêm das 3 sheets processadas em processCarrinhoFichas().
function carrinhoMetaRowsInRange(start,end){
  return S.metaRows.filter(r=>r.date>=start&&r.date<=end&&campaignStage(r.campName)==="Carrinho");
}
function carrinhoFichasInRange(fichas,start,end){
  return fichas.filter(f=>f.date>=start&&f.date<=end);
}
function carrinhoMetrics(start,end){
  const metaRows=carrinhoMetaRowsInRange(start,end);
  const spend=metaRows.reduce((a,r)=>a+r.spend,0);
  const clicks=metaRows.reduce((a,r)=>a+r.clicks,0);
  const fichas=carrinhoFichasInRange(S.carrinhoFichaOrigem,start,end);
  const fichasTotal=fichas.length;
  const fichasComPreco=fichas.filter(f=>f.comPreco).length;
  return{spend,clicks,fichasTotal,fichasComPreco,
    custoFicha:fichasTotal>0?spend/fichasTotal:null,
    custoFichaComPreco:fichasComPreco>0?spend/fichasComPreco:null};
}
function getCarrinhoDaily(start,end){
  const metaByDate={};
  for(const r of S.metaRows){
    if(campaignStage(r.campName)!=="Carrinho")continue;
    if(r.date<start||r.date>end)continue;
    if(!metaByDate[r.date])metaByDate[r.date]={spend:0,clicks:0};
    metaByDate[r.date].spend+=r.spend;metaByDate[r.date].clicks+=r.clicks;
  }
  const fichasByDate={},fichasComPrecoByDate={};
  for(const f of S.carrinhoFichaOrigem){
    if(f.date<start||f.date>end)continue;
    fichasByDate[f.date]=(fichasByDate[f.date]||0)+1;
    if(f.comPreco)fichasComPrecoByDate[f.date]=(fichasComPrecoByDate[f.date]||0)+1;
  }
  const dates=new Set([...Object.keys(metaByDate),...Object.keys(fichasByDate)]);
  return[...dates].sort().map(d=>{
    const m=metaByDate[d]||{spend:0,clicks:0};
    const fichas=fichasByDate[d]||0, fichasComPreco=fichasComPrecoByDate[d]||0;
    return{date:d,label:fDate(d),spend:m.spend,clicks:m.clicks,fichas,fichasComPreco,
      custoFichaComPreco:fichasComPreco>0?m.spend/fichasComPreco:null};
  });
}

// ── Carrinho: Fichas (Origem / Canal) ───────────────────────────────────────
function carrinhoPassQual(tipo,qual){ return !qual||qual==="todas"||tipo===qual; }
// FBAds = tráfego pago reconhecido pela UTM (mesmo critério já usado na Base
// leads da Captação); qualquer outro utm_source vira sua própria origem —
// sem de-para inventado, já que o vocabulário desta base pode não ser igual
// ao de outro projeto.
function carrinhoNormOrigem(o){
  if(o&&o.includes("FBAds"))return "Tráfego";
  return o||"(não informado)";
}
function carrinhoCanalKey(origem,canal){
  if(origem&&origem.includes("FBAds"))return "Tráfego";
  return canal||"(não informado)";
}
function getCarrinhoOrigemRows(fichas,start,end,qual,vendas=[]){
  const byOrigem={};
  for(const f of fichas){
    if(f.date<start||f.date>end)continue;
    if(!carrinhoPassQual(f.tipo,qual))continue;
    const o=carrinhoNormOrigem(f.origem);
    if(!byOrigem[o])byOrigem[o]={origem:o,fichas:0,comPreco:0,vendas:0};
    byOrigem[o].fichas++;
    if(f.comPreco)byOrigem[o].comPreco++;
  }
  for(const v of vendas){
    if(v.date<start||v.date>end)continue;
    if(!carrinhoPassQual(v.tipo,qual))continue;
    const o=carrinhoNormOrigem(v.origem);
    if(!byOrigem[o])byOrigem[o]={origem:o,fichas:0,comPreco:0,vendas:0};
    byOrigem[o].vendas++;
  }
  const total=Object.values(byOrigem).reduce((a,o)=>a+o.fichas,0);
  return Object.values(byOrigem).map(o=>({...o,
    pctComPreco:o.fichas>0?(o.comPreco/o.fichas)*100:0,
    conv:o.fichas>0?(o.vendas/o.fichas)*100:0,
    repres:total>0?(o.fichas/total)*100:0}));
}
function getCarrinhoCanalRows(fichas,start,end,qual,vendas=[]){
  const byCanal={};
  for(const f of fichas){
    if(f.date<start||f.date>end)continue;
    if(!carrinhoPassQual(f.tipo,qual))continue;
    const c=carrinhoCanalKey(f.origem,f.canal);
    if(!byCanal[c])byCanal[c]={canal:c,fichas:0,comPreco:0,vendas:0};
    byCanal[c].fichas++;
    if(f.comPreco)byCanal[c].comPreco++;
  }
  for(const v of vendas){
    if(v.date<start||v.date>end)continue;
    if(!carrinhoPassQual(v.tipo,qual))continue;
    const c=carrinhoCanalKey(v.origem,v.canal);
    if(!byCanal[c])byCanal[c]={canal:c,fichas:0,comPreco:0,vendas:0};
    byCanal[c].vendas++;
  }
  const total=Object.values(byCanal).reduce((a,c)=>a+c.fichas,0);
  return Object.values(byCanal).map(c=>({...c,
    pctComPreco:c.fichas>0?(c.comPreco/c.fichas)*100:0,
    conv:c.fichas>0?(c.vendas/c.fichas)*100:0,
    repres:total>0?(c.fichas/total)*100:0}));
}
function setCarrinhoFichasQual(v){S.carrinhoFichasQual=v;render();}
function setCarrinhoFichasPreco(v){S.carrinhoFichasPreco=v;render();}
function setCarrinhoFichasMode(v){S.carrinhoFichasMode=v;render();}
function setCarrinhoOrigemSearch(v){S.carrinhoOrigemSearch=v;render();}
function setCarrinhoCanalSearch(v){S.carrinhoCanalSearch=v;render();}
function sortCarrinhoOrigem(col){
  const s=S.carrinhoOSort;if(s.col===col)s.dir=s.dir==="asc"?"desc":"asc";else{s.col=col;s.dir="desc";}
  render();
}
function sortCarrinhoCanal(col){
  const s=S.carrinhoCSort;if(s.col===col)s.dir=s.dir==="asc"?"desc":"asc";else{s.col=col;s.dir="desc";}
  render();
}
function renderCarrinhoFichas(){
  const el=document.getElementById("page-carrinho-fichas");if(!el)return;
  const per=getCurrentPeriod();
  const start=S.startDate,end=S.endDate;
  let fichasSrc=S.carrinhoFichasMode==="unicas"?S.carrinhoFichaOrigemUnica:S.carrinhoFichaOrigem;
  let vendasSrc=S.carrinhoVendaOrigem;
  if(S.carrinhoFichasPreco==="comPreco"){
    fichasSrc=fichasSrc.filter(f=>f.comPreco);
    vendasSrc=vendasSrc.filter(v=>v.comPreco);
  }else if(S.carrinhoFichasPreco==="semPreco"){
    fichasSrc=fichasSrc.filter(f=>!f.comPreco);
    vendasSrc=vendasSrc.filter(v=>!v.comPreco);
  }

  const origemRowsAll=getCarrinhoOrigemRows(fichasSrc,start,end,S.carrinhoFichasQual,vendasSrc);
  const _oq=S.carrinhoOrigemSearch.trim().toLowerCase();
  const origemRows=_oq?origemRowsAll.filter(o=>o.origem.toLowerCase().includes(_oq)):origemRowsAll;
  const{col:oCol,dir:oDir}=S.carrinhoOSort;
  const sortedOrigens=[...origemRows].sort((a,b)=>{
    const av=a[oCol]??0,bv=b[oCol]??0;
    if(typeof av==="string")return oDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return oDir==="asc"?av-bv:bv-av;
  });

  const canalRowsAll=getCarrinhoCanalRows(fichasSrc,start,end,S.carrinhoFichasQual,vendasSrc);
  const _cq=S.carrinhoCanalSearch.trim().toLowerCase();
  const canalRows=_cq?canalRowsAll.filter(c=>c.canal.toLowerCase().includes(_cq)):canalRowsAll;
  const{col:cCol,dir:cDir}=S.carrinhoCSort;
  const sortedCanais=[...canalRows].sort((a,b)=>{
    const av=a[cCol]??0,bv=b[cCol]??0;
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });

  const totFichas=origemRowsAll.reduce((a,o)=>a+o.fichas,0);
  const totComPreco=origemRowsAll.reduce((a,o)=>a+o.comPreco,0);
  const totVendas=origemRowsAll.reduce((a,o)=>a+o.vendas,0);
  const pctComPrecoTotal=totFichas>0?(totComPreco/totFichas)*100:0;
  const totConv=totFichas>0?(totVendas/totFichas)*100:0;

  const totFichasAll=getCarrinhoOrigemRows(S.carrinhoFichaOrigem,start,end,S.carrinhoFichasQual).reduce((a,o)=>a+o.fichas,0);
  const totFichasUnicas=getCarrinhoOrigemRows(S.carrinhoFichaOrigemUnica,start,end,S.carrinhoFichasQual).reduce((a,o)=>a+o.fichas,0);
  const duplicadas=totFichasAll-totFichasUnicas;
  const pctDuplicadas=totFichasAll>0?(duplicadas/totFichasAll)*100:0;

  function thO(colKey,lbl){
    const active=oCol===colKey;
    const arrow=active?(oDir==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="sortCarrinhoOrigem('${colKey}')" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }
  function thC(colKey,lbl){
    const active=cCol===colKey;
    const arrow=active?(cDir==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="sortCarrinhoCanal('${colKey}')" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Carrinho — Fichas</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${sortedOrigens.length} origens · ${sortedCanais.length} canais</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--hint)">Qualificação:</span>
      <div class="presets">
        <button class="btn-pre${S.carrinhoFichasQual==="todas"?" on":""}" onclick="setCarrinhoFichasQual('todas')">Todas</button>
        <button class="btn-pre${S.carrinhoFichasQual==="traf"?" on":""}" onclick="setCarrinhoFichasQual('traf')">Tráfego</button>
        <button class="btn-pre${S.carrinhoFichasQual==="org"?" on":""}" onclick="setCarrinhoFichasQual('org')">Orgânico</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--hint)">Preço:</span>
      <div class="presets">
        <button class="btn-pre${S.carrinhoFichasPreco==="total"?" on":""}" onclick="setCarrinhoFichasPreco('total')">Total</button>
        <button class="btn-pre${S.carrinhoFichasPreco==="comPreco"?" on":""}" onclick="setCarrinhoFichasPreco('comPreco')">Com preço</button>
        <button class="btn-pre${S.carrinhoFichasPreco==="semPreco"?" on":""}" onclick="setCarrinhoFichasPreco('semPreco')">Sem preço</button>
      </div>
      <span style="font-size:10px;color:var(--hint)">"com preço" = respondeu a pergunta de valor/forma de pagamento</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">

        <button class="btn-pre${S.carrinhoFichasMode==="unicas"?" on":""}" onclick="setCarrinhoFichasMode('unicas')">Únicas</button>
      </div>
      <span style="font-size:10px;color:var(--hint)">${S.carrinhoFichasMode==="unicas"?"deduplicadas por telefone/e-mail — considera só a 1ª ficha de cada pessoa":"toda ficha preenchida conta, mesmo repetida"}</span>
    </div>

    ${!S.carrinhoPrecoKeyFound?`<div class="err" style="border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06);color:#fbbf24;margin-bottom:16px">⚠️ Coluna de "forma de pagamento" não encontrada — filtro Com preço/Sem preço fica sem dado.</div>`:""}

    <div class="g5" style="margin-bottom:20px">
      ${kpiCard("Fichas",totFichas.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("Com preço",totComPreco.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("% com preço",fPct(pctComPrecoTotal),"","var(--text-strong)")}
      ${kpiCard("Vendas",totVendas.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("Conversão ficha→venda",fPct(totConv),"","var(--text-strong)")}
    </div>
    <div class="g2" style="margin-bottom:20px">
      ${kpiCard("Fichas duplicadas",fPct(pctDuplicadas),`${duplicadas.toLocaleString("pt-BR")} fichas`,"var(--text-strong)")}
      ${kpiCard("Vendas não identificadas",S.carrinhoVendasUnmatched.toLocaleString("pt-BR"),"sem telefone/e-mail batendo com nenhuma ficha","var(--text-strong)")}

// ── Carrinho: Vendas ─────────────────────────────────────────────────────────
// "Base vendas" não tem valor da venda (Nome/Email/Whatsapp1/Data Correta/UTM
// Source) — por isso não dá pra calcular faturamento/ROAS aqui, só volume e
// conversão de ficha em venda. Cada venda é casada com a ficha (tráfego ou
// orgânico) mais antiga da pessoa, batendo por telefone OU e-mail.
function getCarrinhoVendaOrigemRows(start,end){
  const by={};
  for(const v of S.carrinhoVendaOrigem){
    if(v.date<start||v.date>end)continue;
    const o=carrinhoNormOrigem(v.origem);
    by[o]=(by[o]||0)+1;
  }
  return Object.entries(by).map(([origem,vendas])=>({origem,vendas})).sort((a,b)=>b.vendas-a.vendas);
}
function getCarrinhoVendasDaily(start,end){
  return Object.keys(S.carrinhoVendasPorDia).filter(d=>d>=start&&d<=end).sort()

}

// ── Carrinho: Campanhas/Anúncios ────────────────────────────────────────────
// Agregação por CAMPANHA (Carrinho) — mesma base de anúncios, só que somada
// por campName. Fichas/vendas são casadas por campName (cada ficha/venda de
// tráfego já carrega o campName do anúncio que a originou).
function getCarrinhoCampRows(start,end){
  const rows=carrinhoMetaRowsInRange(start,end);
  const byCamp={};
  for(const r of rows){
    const key=r.campName||"(sem campanha)";
    if(!byCamp[key])byCamp[key]={campName:key,spend:0,clicks:0,impressions:0};
    const c=byCamp[key];
    c.spend+=r.spend;c.clicks+=r.clicks;c.impressions+=r.impressions;
  }
  const fichasByCamp={},fichasComPrecoByCamp={};
  for(const f of S.carrinhoFichaAttrib){
    if(f.date<start||f.date>end)continue;
    const cn=f.campName||"(sem campanha)";
    fichasByCamp[cn]=(fichasByCamp[cn]||0)+1;
    if(f.comPreco)fichasComPrecoByCamp[cn]=(fichasComPrecoByCamp[cn]||0)+1;
  }
  const vendasByCamp={};
  for(const v of S.carrinhoVendaAttrib){
    if(v.date<start||v.date>end)continue;
    const cn=v.campName||"(sem campanha)";
    vendasByCamp[cn]=(vendasByCamp[cn]||0)+1;
  }
  return Object.values(byCamp).map(c=>{
    const fichas=fichasByCamp[c.campName]||0, fichasComPreco=fichasComPrecoByCamp[c.campName]||0;
    const vendas=vendasByCamp[c.campName]||0;
    return{...c,
      cpc:c.clicks>0?c.spend/c.clicks:null,
      ctr:c.impressions>0?(c.clicks/c.impressions)*100:0,
      fichas,fichasComPreco,vendas,
      convFichaVenda:fichas>0?(vendas/fichas)*100:0,
      custoFichaComPreco:fichasComPreco>0?c.spend/fichasComPreco:null};
  });
}
// selectedCamps (Set opcional) → mesmo esquema de cross-filtering da Captação:
// se houver campanhas selecionadas, os anúncios são restritos a elas antes de
// agregar por adName.
function carrinhoAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=carrinhoMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName||"(sem campanha)"));
  const byAd={};
  for(const r of rows){
    const key=r.adName||"(sem nome)";
    if(!byAd[key])byAd[key]={adName:key,campName:r.campName,igUrl:r.igUrl||"",spend:0,clicks:0,impressions:0};
    const a=byAd[key];
    a.spend+=r.spend;a.clicks+=r.clicks;a.impressions+=r.impressions;
    if(!a.igUrl&&r.igUrl)a.igUrl=r.igUrl;
  }
  const fichasByAd={},fichasComPrecoByAd={};
  for(const f of S.carrinhoFichaAttrib){
    if(f.date<start||f.date>end)continue;
    fichasByAd[f.adName]=(fichasByAd[f.adName]||0)+1;
    if(f.comPreco)fichasComPrecoByAd[f.adName]=(fichasComPrecoByAd[f.adName]||0)+1;
  }
  const vendasByAd={};
  for(const v of S.carrinhoVendaAttrib){
    if(v.date<start||v.date>end)continue;
    vendasByAd[v.adName]=(vendasByAd[v.adName]||0)+1;
  }
  return Object.values(byAd).map(a=>{
    const fichas=fichasByAd[a.adName]||0, fichasComPreco=fichasComPrecoByAd[a.adName]||0;
    const vendas=vendasByAd[a.adName]||0;
    return{...a,
      cpc:a.clicks>0?a.spend/a.clicks:null,
      ctr:a.impressions>0?(a.clicks/a.impressions)*100:0,
      fichas,fichasComPreco,vendas,
      convFichaVenda:fichas>0?(vendas/fichas)*100:0,
      custoFichaComPreco:fichasComPreco>0?a.spend/fichasComPreco:null};
  });
}

function sortCarrinhoAds(col){

// Texto copiável do resumo do anúncio — mesmo espírito do adResumoBlock() da
// Captação, mas com os campos que existem no Carrinho (fichas com preço,
// custo/ficha com preço vs meta, vendas/conversão) em vez de faixa/quiz.
function carrinhoAdResumoBlock(a){
  const lines=[];
  lines.push(`Nome do ad ⤵️`);
  lines.push(a.adName);
  lines.push(``);
  if(a.igUrl)lines.push(a.igUrl);
  lines.push(`Investimento:\t${fBRL(a.spend)}`);
  lines.push(`Cliques:\t${a.clicks.toLocaleString("pt-BR")}`);
  lines.push(`CPC:\t${a.cpc!=null?fBRL(a.cpc):"—"}`);
  lines.push(``);
  lines.push(`Fichas:\t${a.fichas}`);
  lines.push(`Fichas com preço:\t${a.fichasComPreco}`);
  lines.push(`Custo/ficha com preço:\t${a.custoFichaComPreco!=null?fBRL(a.custoFichaComPreco):"—"} (meta ${fBRL(META_CARRINHO_CUSTO_FICHA_COM_PRECO)})`);
  lines.push(``);
  lines.push(`Vendas:\t${a.vendas}`);
  lines.push(`Conversão ficha→venda:\t${fPct(a.convFichaVenda)}`);
  lines.push(`__________________________`);
  return lines.join("\n");
}
function copyCarrinhoAdResumo(){
  const el=document.getElementById("page-carrinho-anuncios");
  const text=el?._carrinhoAdResumoText||"";if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    document.querySelectorAll(".btn-copy-carrinho-ads").forEach(b=>{
      const orig=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";
      setTimeout(()=>{b.innerHTML=orig;b.style.color="";},1800);
    });
  }).catch(()=>alert("Não foi possível copiar. Selecione o texto manualmente."));
}
function renderCarrinhoAnuncios(){
  const el=document.getElementById("page-carrinho-anuncios");if(!el)return;
  const per=getCurrentPeriod();
  const start=S.startDate,end=S.endDate;
  const escName=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

  const campRowsAll=getCarrinhoCampRows(start,end);
  const _cq=S.carrinhoCampSearch.trim().toLowerCase();
  const campRows=_cq?campRowsAll.filter(c=>c.campName.toLowerCase().includes(_cq)):campRowsAll;
  const{col:cCol,dir:cDir}=S.carrinhoCampSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol],bv=b[cCol];
    if(av==null&&bv==null)return 0;

    if(bv==null)return -1;
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);

  const adsAll=carrinhoAdRows(start,end,S.carrinhoSelectedCamps);

    if(av==null&&bv==null)return 0;

    if(bv==null)return -1;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;

  const tot=campRowsAll.reduce((a,x)=>({spend:a.spend+x.spend,clicks:a.clicks+x.clicks,fichas:a.fichas+x.fichas,fichasComPreco:a.fichasComPreco+x.fichasComPreco,vendas:a.vendas+x.vendas}),{spend:0,clicks:0,fichas:0,fichasComPreco:0,vendas:0});
  const totCustoFichaComPreco=tot.fichasComPreco>0?tot.spend/tot.fichasComPreco:null;

  }

    return `<th onclick="sortCarrinhoAds('${colKey}')" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;

    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Carrinho — Campanhas/Anúncios</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${sortedCamps.length} campanha(s) · ${sortedAds.length} anúncio(s)${S.carrinhoSelectedCamps.size>0?` · filtrado por ${S.carrinhoSelectedCamps.size} campanha(s)`:""}</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

      ${kpiCard("Investimento",fBRL(tot.spend),"","var(--text-strong)")}
      ${kpiCard("Cliques",tot.clicks.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("Fichas com preço",tot.fichasComPreco.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("Custo/ficha com preço",totCustoFichaComPreco!=null?fBRL(totCustoFichaComPreco):"—",`Meta: ${fBRL(META_CARRINHO_CUSTO_FICHA_COM_PRECO)}`,totCustoFichaComPreco!=null?statusColor(totCustoFichaComPreco,META_CARRINHO_CUSTO_FICHA_COM_PRECO,false):"var(--text-strong)",false,totCustoFichaComPreco,META_CARRINHO_CUSTO_FICHA_COM_PRECO,false)}
      ${kpiCard("Vendas (conv. ficha→venda)",tot.vendas.toLocaleString("pt-BR"),fPct(totConvFichaVenda),"var(--text-strong)")}

// ── Helpers compartilhados dos resumos de etapa (Aquecimento/Lembrete/Aulas) ─
function setManualAlcance(key,v){
  const n=parseInt(String(v).replace(/\D/g,""));
  S.manualAlcance[key]=(isNaN(n)||n<=0)?null:n;
  render();
}
// Linha label/valor/meta+emoji — mesmo padrão visual do Resumo diário.
function stageRow(lbl,val,metaStr,emoji){
  return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
    <span style="color:var(--muted);font-size:12px">${lbl}</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-strong)">${val}</span>
    <span style="font-size:14px;min-width:90px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
  </div>`;
}
// Linha de input manual (Alcance ou Likes) — mesmo padrão do campo de
// investimento manual do Resumo diário, com id próprio pra restaurar o foco
// depois do re-render (senão o cursor pula pro início a cada tecla digitada).
function stageManualRow(inputId,lbl,value,setterCall,metaStr,emoji){
  return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
    <span style="color:var(--muted);font-size:12px">${lbl}</span>
    <input id="${inputId}" value="${value||''}" placeholder="inserir manualmente" inputmode="numeric"
      oninput="${setterCall}"
      onkeydown="if(event.key==='Enter')this.blur()"
      style="font-family:'JetBrains Mono',monospace;font-size:13px;color:${value?'#fbbf24':'var(--text-strong)'};background:transparent;border:none;border-bottom:1px solid ${value?'rgba(251,191,36,.4)':'rgba(255,255,255,.15)'};outline:none;padding:2px 0;width:100%"/>
    <span style="font-size:14px;min-width:90px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
  </div>`;
}
function restoreStageFocus(fid){
  if(!fid)return;
  requestAnimationFrame(()=>{
    const s=document.getElementById(fid);
    if(s){s.focus();const l=s.value.length;s.setSelectionRange(l,l);}
  });
}
// Tabela de likes × benchmark (fator X × leads ao vivo) — usada no Lembrete

function likesBenchmarkTableHtml(rows,colLabel){

      ${rows.map(r=>`<tr style="border-top:1px solid rgba(255,255,255,.04)">

        <td class="mono" style="text-align:right;padding:4px 8px;color:var(--text-strong)">${r.likes.toLocaleString("pt-BR")}</td>

function likesBenchmarkTableText(rows,colLabel){

// Soma do planejamento de uma etapa até hoje (inclusive) — usado nos
// resumos pra mostrar "(planej até hoje: R$ x)" ao lado do realizado.
function planoAcumAteHoje(plano){
  if(!plano||!plano.length)return null;
  const hoje=todayISO();
  return plano.filter(x=>x.date<=hoje).reduce((a,x)=>a+x.investimento,0);
}

// Copia o resumo de UMA etapa por vez (independente do botão da Captação e
// dos outros dois) — o feedback "✓ Copiado!" aparece só no botão clicado.
function copyStageResumo(scope,btn){
  let text="";
  if(scope==="aquecimento")text=aquecimentoResumoText();
  else if(scope==="lembrete")text=lembreteResumoText();
  else if(scope==="aulas")text=aulasResumoText();
  if(!text||!btn)return;
  navigator.clipboard.writeText(text).then(()=>{

// ── Análise completa por etapa (Aquecimento/Lembrete/Aula01/02/03) ─────────
// KPIs + gráfico "Acumulado por dia" (toggle CPC/Tx75%/Cptx75%) + gráfico "%
// do investimento por dia" + tabela de anúncios sortável/buscável — mesmo
// padrão de completude da referência ("oro_jul26 | Mini Debriefing"), com
// nossos dados reais de cada etapa.
function stageMetricCfg(metas){
  metas=metas||{};
  return {
    cpc:   {key:"cpc",   label:"CPC",             color:CHART_GAP, meta:metas.cpc?metas.cpc.val:null,       fmt:fBRL},
    tx75:  {key:"tx75",  label:"Tx 75%",          color:CHART_LEAD,meta:metas.tx75?metas.tx75.val:null,      fmt:v=>fPct(v)},
    cptx75:{key:"cptx75",label:"Custo por Tx 75%",color:CHART_INV, meta:metas.cptx75?metas.cptx75.val:null, fmt:fBRL},
  };
}
// Agrega as linhas de anúncio de uma etapa por DIA (pro gráfico de tendência
// e pro gráfico de % de investimento).
function stageDailyAgg(rows){
  const byDate={};
  for(const r of rows){
    if(!byDate[r.date])byDate[r.date]={date:r.date,spend:0,clicks:0,impressions:0,video75:0,view3s:0};
    const d=byDate[r.date];
    d.spend+=r.spend;d.clicks+=r.clicks;d.impressions+=r.impressions;d.video75+=r.video75;d.view3s+=(r.view3s||0);
  }
  return Object.keys(byDate).sort().map(k=>{
    const d=byDate[k];
    return{...d,label:fDate(d.date),
      cpc:d.clicks>0?d.spend/d.clicks:null,
      tx75:d.impressions>0?(d.video75/d.impressions)*100:null,
      cptx75:d.video75>0?d.spend/d.video75:null};
  });
}
// Agrega as linhas de anúncio de uma etapa por ANÚNCIO (pro Anúncio/Investido/
// Cliques/CPC/Impressões/75% Assistido/Views 3s/Tx75%/Cptx75%/Ver da tabela).
function stageAdAgg(rows){
  const byAd={};
  for(const r of rows){
    const key=r.adName||"(sem nome)";
    if(!byAd[key])byAd[key]={adName:key,igUrl:r.igUrl||"",spend:0,clicks:0,impressions:0,video75:0,view3s:0};
    const a=byAd[key];
    a.spend+=r.spend;a.clicks+=r.clicks;a.impressions+=r.impressions;a.video75+=r.video75;a.view3s+=(r.view3s||0);
    if(!a.igUrl&&r.igUrl)a.igUrl=r.igUrl;
  }
  return Object.values(byAd).map(a=>({...a,
    cpc:a.clicks>0?a.spend/a.clicks:null,
    tx75:a.impressions>0?(a.video75/a.impressions)*100:null,
    cptx75:a.video75>0?a.spend/a.video75:null}));
}
function setStageChartMetric(scope,metric){S.stageChartMetric[scope]=metric;render();}
function setStageAdSearch(scope,v){S.stageAdSearch[scope]=v;render();}
function sortStageAds(scope,col){
  const s=S.stageAdSort[scope];
  if(s.col===col)s.dir=s.dir==="asc"?"desc":"asc";else{s.col=col;s.dir="desc";}
  render();
}
// KPI card com input embutido (pro Alcance manual) — mesmo visual do kpiCard,
// mas o valor é um campo editável em vez de texto estático.
function kpiCardManual(lbl,inputId,value,setterCall,sub){
  return `<div class="kc">

      style="width:100%;background:transparent;border:none;border-bottom:1px solid ${value?"rgba(251,191,36,.4)":"rgba(255,255,255,.15)"};outline:none;padding:2px 0;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;letter-spacing:-.02em;color:${value?"#fbbf24":"var(--text-strong)"}"/>

  </div>`;
}
// HTML completo da análise de uma etapa (usado direto nas abas Aquecimento/
// Lembrete, e 3x dentro da aba Aulas — uma vez por aula). "scope" identifica
// o estado independente (toggle de gráfico, busca e ordenação da tabela) e
// os ids dos canvases; "alcanceKey" é a chave em S.manualAlcance.
function stageAnalysisHtml(scope,rows,metas,alcanceKey){
  metas=metas||{};
  const m=stageMetrics(rows);
  const alcance=S.manualAlcance[alcanceKey];
  const freq=alcance>0?m.impressions/alcance:null;
  const cfg=stageMetricCfg(metas);
  const chartMetric=S.stageChartMetric[scope]||"cpc";
  const mc=cfg[chartMetric]||cfg.cpc;

  const adsAll=stageAdAgg(rows);
  const q=(S.stageAdSearch[scope]||"").trim().toLowerCase();
  const adsF=q?adsAll.filter(a=>a.adName.toLowerCase().includes(q)):adsAll;
  const {col,dir}=S.stageAdSort[scope];
  const adsSorted=[...adsF].sort((a,b)=>{
    const av=a[col],bv=b[col];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
  function thS(colKey,lbl){
    const active=col===colKey;
    const arrow=active?(dir==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="sortStageAds('${scope}','${colKey}')" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }
  const trendCid="c-trend-"+scope, pctCid="c-pct-"+scope, trendTid="t-trend-"+scope;

  return `
    <div class="g4" style="margin-bottom:13px">
      ${kpiCard("Investido total",fBRL(m.spend),"","var(--text-strong)")}
      ${kpiCard("Cliques",m.clicks.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("CPC",m.cpc!=null?fBRL(m.cpc):"—",metas.cpc?`Meta: ${fBRL(metas.cpc.val)}`:"sem meta",metas.cpc&&m.cpc!=null?statusColor(m.cpc,metas.cpc.val,metas.cpc.higher):"var(--text-strong)",false,m.cpc,metas.cpc?metas.cpc.val:null,metas.cpc?metas.cpc.higher:null)}
      ${kpiCardManual("Alcance (manual 🔧)",`manual-alcance-${scope}`,alcance,`setManualAlcance('${alcanceKey}',this.value)`,"API não fornece este dado")}
    </div>
    <div class="g3" style="margin-bottom:20px">
      ${kpiCard("Frequência",freq!=null?freq.toFixed(2).replace(".",","):"—",metas.frequencia?`Meta: ${metas.frequencia.val}`:"sem meta","var(--text-strong)",false,freq,metas.frequencia?metas.frequencia.val:null,metas.frequencia?metas.frequencia.higher:null)}
      ${kpiCard("Tx 75%",m.tx75!=null?fPct(m.tx75):"—",metas.tx75?`Meta: ${metas.tx75.val}%`:"sem meta","var(--text-strong)",false,m.tx75,metas.tx75?metas.tx75.val:null,metas.tx75?metas.tx75.higher:null)}
      ${kpiCard("Custo por Tx 75%",m.cptx75!=null?fBRL(m.cptx75):"—",metas.cptx75?`Meta: ${fBRL(metas.cptx75.val)}`:"sem meta","var(--text-strong)",false,m.cptx75,metas.cptx75?metas.cptx75.val:null,metas.cptx75?metas.cptx75.higher:null)}
    </div>

    <div class="cc" style="position:relative;margin-bottom:14px">
      <div class="ch">
        <span class="ct">Acumulado por dia</span>
        <div class="presets">
          ${["cpc","tx75","cptx75"].map(k=>`<button class="btn-pre${chartMetric===k?" on":""}" onclick="setStageChartMetric('${scope}','${k}')">${cfg[k].label}</button>`).join("")}
        </div>
      </div>
      <div style="position:relative"><canvas id="${trendCid}"></canvas><div class="tip" id="${trendTid}"></div></div>
    </div>

    <div class="cc" style="position:relative;margin-bottom:20px">
      <div class="ch"><span class="ct">% do investimento por dia</span></div>
      <div style="position:relative"><canvas id="${pctCid}"></canvas></div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0;margin-top:0">Anúncios</div>
      <span style="font-size:10px;color:var(--hint)">${adsSorted.length} anúncio(s)</span>
    </div>
    <div style="position:relative;margin-bottom:10px">
      <input oninput="setStageAdSearch('${scope}',this.value)" value="${S.stageAdSearch[scope]||""}" placeholder="Buscar anúncio…" style="width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box"/>
    </div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:6px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th onclick="sortStageAds('${scope}','adName')" style="cursor:pointer">Anúncio</th>
          ${thS("spend","Investido")}
          ${thS("clicks","Cliques")}
          ${thS("cpc","CPC")}
          ${thS("impressions","Impressões")}
          ${thS("video75","75% Assistido")}
          ${thS("view3s","Views 3s")}
          ${thS("tx75","Tx75%")}
          ${thS("cptx75","Cptx75%")}
          <th>Ver</th>
        </tr></thead>
        <tbody>
          ${adsSorted.length===0?`<tr><td colspan="10" style="text-align:center;color:var(--hint);padding:20px">Sem dados de anúncios no período</td></tr>`:
          adsSorted.map(a=>`<tr>
            <td>${a.adName}</td>
            <td class="mono" style="text-align:right">${fBRL(a.spend)}</td>
            <td class="mono" style="text-align:right">${a.clicks.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.cpc!=null?fBRL(a.cpc):"—"}</td>
            <td class="mono" style="text-align:right">${a.impressions.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.video75.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.view3s.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.tx75!=null?fPct(a.tx75):"—"}</td>
            <td class="mono" style="text-align:right">${a.cptx75!=null?fBRL(a.cptx75):"—"}</td>
            <td>${a.igUrl?`<a href="${a.igUrl}" target="_blank" rel="noopener" style="color:#60a5fa">Ver ↗</a>`:"—"}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>
    </div>`;
}
// Desenha os 2 gráficos de uma etapa depois que o HTML de stageAnalysisHtml
// já está no DOM (precisa dos canvases existirem pra medir largura).
// "chartStyle" controla o gráfico "Acumulado por dia": "line" (padrão, pra
// etapas com vários dias de histórico) ou "bar" (pra etapas que rodam num
// período muito curto — ex.: Aulas, 1 dia cada — onde uma linha não mostra
// nada de útil).
function mountStageCharts(scope,rows,metas,chartStyle){
  const daily=stageDailyAgg(rows);
  const totalSpend=rows.reduce((a,r)=>a+r.spend,0);
  const cfg=stageMetricCfg(metas);
  const mc=cfg[S.stageChartMetric[scope]||"cpc"]||cfg.cpc;
  const trendCid="c-trend-"+scope, pctCid="c-pct-"+scope, trendTid="t-trend-"+scope;
  const box1=document.getElementById(trendCid)?.parentElement;
  if(box1){
    if(chartStyle==="bar")drawMetricBar(trendCid,daily,mc.key,mc.color,mc.meta,box1.clientWidth,200,mc.fmt);
    else drawMetricLine(trendCid,daily,mc.key,mc.color,mc.meta,box1.clientWidth,200,mc.fmt);
  }
  setupTip(trendCid,trendTid,daily,[{name:mc.label,color:mc.color,key:mc.key,fmt:mc.fmt}],52,12);
  const box2=document.getElementById(pctCid)?.parentElement;
  if(box2)drawBarPercent(pctCid,daily,"spend",totalSpend,CHART_INV,box2.clientWidth,180);
}

// Emoji apontando pra linha de hoje nas tabelas de Planejado/Realizado — sutil,

function hojeBadge(isToday){
  return isToday?` 👈`:"";
