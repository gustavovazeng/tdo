// Menor e maior data entre TODAS as etapas do plano (Captação ∪ Aquecimento ∪
// Lembrete ∪ Aulas ∪ Carrinho) — usado pra avisar quando "hoje" cai antes do
// lançamento começar ou depois dele acabar (não tem linha "HOJE" pra mostrar
// nesses casos, então o aviso substitui o apontador).
function planoDateRange(){
  const allDates=[...PLANO_DIARIO,...PLANO_AQUECIMENTO,...PLANO_LEMBRETE,...PLANO_AULAS,...PLANO_CARRINHO].map(p=>p.date);
  if(!allDates.length)return null;
  return{min:allDates.reduce((a,d)=>d<a?d:a),max:allDates.reduce((a,d)=>d>a?d:a)};
}
function renderPlanoReal(){
  const el=document.getElementById("page-planoreal");if(!el)return;
  const today=todayISO();
  const plano=PLANO_DIARIO;
  const range=planoDateRange();
  const diffDays=(a,b)=>Math.round((Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/86400000);
  let hojeNotice=null;
  if(range){
    if(today<range.min)hojeNotice=`📅 Faltam ${diffDays(range.min,today)} dia(s) pro início do plano (${fDateBR(range.min)}) — nenhuma linha "HOJE" ainda.`;
    else if(today>range.max)hojeNotice=`📅 Plano encerrado há ${diffDays(today,range.max)} dia(s) (terminou em ${fDateBR(range.max)}) — sem linha "HOJE" pra mostrar.`;
  }

  const rows=plano.map(p=>{
    const isFuture=p.date>today;
    const investReal=isFuture?null:stageSpendForDate("Captação",p.date);
    const leadsReal=isFuture?null:(S.leadsByDate[p.date]||0);
    return{...p,isFuture,isToday:p.date===today,investReal,leadsReal};
  });

  const totalInvestPlan=plano.reduce((a,p)=>a+p.investimento,0);
  const totalLeadsPlan=plano.reduce((a,p)=>a+p.leads,0);
  const totalInvestReal=rows.reduce((a,r)=>a+(r.investReal||0),0);
  const totalLeadsReal=rows.reduce((a,r)=>a+(r.leadsReal||0),0);

  const ateHoje=rows.filter(r=>r.date<=today);
  const investPlanAteHoje=ateHoje.reduce((a,r)=>a+r.investimento,0);
  const leadsPlanAteHoje=ateHoje.reduce((a,r)=>a+r.leads,0);

  const diasTotal=plano.length;

  // Comparação de investimento nesta aba: quanto MAIS investido em relação
  // ao plano, melhor (ficar abaixo do plano é ruim — sinal de ritmo de
  // verba atrasado); por isso higherIsBetter=true aqui (ao contrário da
  // Principal, onde investimento menor é mais eficiente).
  const investAteHojeColor=investPlanAteHoje>0?statusColor(totalInvestReal,investPlanAteHoje,true):"var(--text-strong)";
  const leadsAteHojeColor=leadsPlanAteHoje>0?statusColor(totalLeadsReal,leadsPlanAteHoje,true):"var(--text-strong)";

  // Resumo por etapa — só investimento (as demais etapas não têm meta de leads).
  // "real" de cada etapa vem só das campanhas cujo NOME bate com aquela etapa
  // (via campaignStage), não do gasto total da Base Meta no período do plano
  // — senão o investimento de Captação vazaria pro "realizado" de Lembrete
  // etc. só por coincidência de data.
  const etapas=[
    {nome:"Captação",plan:totalInvestPlan,real:totalSpendForStage("Captação")},
    {nome:"Aquecimento",plan:PLANO_AQUECIMENTO.reduce((a,p)=>a+p.investimento,0)||PLANO_AQUECIMENTO_TOTAL,real:totalSpendForStage("Aquecimento")},
    {nome:"Lembrete",plan:PLANO_LEMBRETE.reduce((a,p)=>a+p.investimento,0),real:totalSpendForStage("Lembrete")},
    {nome:"Aulas",plan:PLANO_AULAS.reduce((a,p)=>a+p.investimento,0),real:totalSpendForStage("Aulas")},
    {nome:"Carrinho",plan:PLANO_CARRINHO.reduce((a,p)=>a+p.investimento,0),real:totalSpendForStage("Carrinho")},
  ];
  const etapasTotalPlan=etapas.reduce((a,e)=>a+e.plan,0);
  const etapasTotalReal=etapas.reduce((a,e)=>a+e.real,0);

  // Tabela diária de uma etapa sem meta de leads (Aquecimento/Lembrete/
  // Aulas/Carrinho) — só Investimento Planejado × Realizado, mesmo padrão
  // visual da tabela de Captação. Investimento realizado é filtrado por
  // CAMPANHA da etapa (via campaignStage), não pelo gasto do dia inteiro —
  // assim uma campanha de Captação rodando na mesma data não conta como
  // "realizado" de Lembrete/Aquecimento só por coincidência de data.
  function stageTable(label,stageName,planArr){
    if(planArr.length===0){
      return `<div class="section-lbl">${label}</div>
        <div class="cc" style="color:var(--hint);font-size:12px;padding:18px 20px;margin-bottom:22px">Sem detalhamento diário informado ainda para esta etapa.</div>`;
    }
    const stageRows=planArr.map(p=>{
      const isFuture=p.date>today;
      const real=isFuture?null:stageSpendForDate(stageName,p.date);
      return{...p,real,isToday:p.date===today};
    });
    const stagePlanTotal=planArr.reduce((a,p)=>a+p.investimento,0);
    const stageRealTotal=stageRows.reduce((a,r)=>a+(r.real||0),0);
    return `
    <div class="section-lbl">${label}</div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:22px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Data</th>
          <th style="text-align:right">Investimento Planejado</th>
          <th style="text-align:right">Investimento Realizado</th>
        </tr></thead>
        <tbody>
          ${stageRows.map(r=>{
            const investColor=r.real==null?"var(--hint)":statusColor(r.real,r.investimento,true);
            return `<tr id="${r.isToday?"row-hoje-"+stageName:""}" style="background:${r.isToday?"rgba(59,130,246,.08)":"transparent"}">
            <td class="mono">${diaSemana(r.date)}, ${fDate(r.date)}${hojeBadge(r.isToday)}</td>
            <td class="mono" style="text-align:right">${fBRL(r.investimento)}</td>
            <td class="mono" style="text-align:right;color:${investColor}">${r.real==null?"—":fBRL(r.real)}</td>
          </tr>`;}).join("")}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border-h)">
            <td style="font-weight:700;color:var(--text-strong)">Total</td>
            <td class="mono" style="text-align:right;font-weight:700">${fBRL(stagePlanTotal)}</td>
            <td class="mono" style="text-align:right;font-weight:700">${fBRL(stageRealTotal)}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Planejado / Realizado</div>
        <div class="hdr-sub">lançamento completo · atualizado em: ${S.updated||"—"}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    ${hojeNotice?`<div class="notice">${hojeNotice}</div>`:""}

    <div class="section-lbl" style="margin-top:0">Resumo por etapa (investimento)</div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:22px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Etapa</th><th style="text-align:right">Investimento Planejado</th><th style="text-align:right">Investimento Realizado</th></tr></thead>
        <tbody>
          ${etapas.map(e=>`<tr>
            <td>${e.nome}</td>
            <td class="mono" style="text-align:right">${fBRL(e.plan)}</td>
            <td class="mono" style="text-align:right;color:${e.real>0?statusColor(e.real,e.plan,true):"var(--hint)"}">${e.real>0?fBRL(e.real):"—"}</td>
          </tr>`).join("")}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border-h)">
            <td style="font-weight:700;color:var(--text-strong)">Total lançamento</td>
            <td class="mono" style="text-align:right;font-weight:700">${fBRL(etapasTotalPlan)}</td>
            <td class="mono" style="text-align:right;font-weight:700">${fBRL(etapasTotalReal)}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>

    <div class="section-lbl">Captação — detalhe diário (única etapa com meta de leads)</div>
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Investimento Planejado",fBRL(totalInvestPlan),`${diasTotal} dias`,"var(--text-strong)")}
      ${kpiCard("Investimento Realizado",fBRL(totalInvestReal),`Investimento planejado até hoje: ${fBRL(investPlanAteHoje)}`,investAteHojeColor,false,totalInvestReal,investPlanAteHoje,true)}
      ${kpiCard("Leads Planejados",totalLeadsPlan.toLocaleString("pt-BR"),`${diasTotal} dias`,"var(--text-strong)")}
      ${kpiCard("Leads Realizados",totalLeadsReal.toLocaleString("pt-BR"),`Leads planejados até hoje: ${leadsPlanAteHoje.toLocaleString("pt-BR")}`,leadsAteHojeColor,false,totalLeadsReal,leadsPlanAteHoje,true)}
    </div>

    <div class="cc" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Data</th>
          <th style="text-align:right">Investimento Planejado</th>
          <th style="text-align:right">Investimento Realizado</th>
          <th style="text-align:right">Leads Planejados</th>
          <th style="text-align:right">Leads Realizados</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>{
            const investColor=r.investReal==null?"var(--hint)":statusColor(r.investReal,r.investimento,true);
            const leadsColor=r.leadsReal==null?"var(--hint)":statusColor(r.leadsReal,r.leads,true);
            return `<tr id="${r.isToday?"row-hoje-Captação":""}" style="background:${r.isToday?"rgba(59,130,246,.08)":"transparent"}">
              <td class="mono">${diaSemana(r.date)}, ${fDate(r.date)}${hojeBadge(r.isToday)}</td>
              <td class="mono" style="text-align:right">${fBRL(r.investimento)}</td>
              <td class="mono" style="text-align:right;color:${investColor}">${r.investReal==null?"—":fBRL(r.investReal)}</td>
              <td class="mono" style="text-align:right">${r.leads.toLocaleString("pt-BR")}</td>
              <td class="mono" style="text-align:right;color:${leadsColor}">${r.leadsReal==null?"—":r.leadsReal.toLocaleString("pt-BR")}</td>
            </tr>`;
          }).join("")}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border-h)">
            <td style="font-weight:700;color:var(--text-strong)">Total</td>
            <td class="mono" style="text-align:right;font-weight:700">${fBRL(totalInvestPlan)}</td>
            <td class="mono" style="text-align:right;font-weight:700;color:var(--text-strong)" title="Total realizado ainda não é comparável ao plano do período inteiro, que não terminou">${fBRL(totalInvestReal)}</td>
            <td class="mono" style="text-align:right;font-weight:700">${totalLeadsPlan.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right;font-weight:700;color:var(--text-strong)" title="Total realizado ainda não é comparável ao plano do período inteiro, que não terminou">${totalLeadsReal.toLocaleString("pt-BR")}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>

    ${stageTable("Aquecimento","Aquecimento",PLANO_AQUECIMENTO)}
    ${stageTable("Lembrete","Lembrete",PLANO_LEMBRETE)}
    ${stageTable("Aulas","Aulas",PLANO_AULAS)}
    ${stageTable("Carrinho","Carrinho",PLANO_CARRINHO)}

    <div class="foot">TDO · Captação · dados locais (CSV embutido) + planejamento manual</div>`;
}

// ── Main render ───────────────────────────────────────────────────────────
function render(){
  const loadingEl=document.getElementById("loading");
  if(loadingEl)loadingEl.style.display=S.loading?"flex":"none";
  document.querySelectorAll(".page").forEach(el=>{el.style.display=(el.classList.contains("active")&&!S.loading)?"block":"none";});
  if(S.loading)return;
  renderHeader();
  if(S.currentPage==="captacao"){
    if(S.currentSubPage==="principal")renderPrincipal();
    else if(S.currentSubPage==="anuncios")renderAnuncios();
    else if(S.currentSubPage==="metricas")renderMetricasTrafego();
    else if(S.currentSubPage==="leads")renderLeads();
  }
  else if(S.currentPage==="aquecimento")renderAquecimento();
  else if(S.currentPage==="lembrete")renderLembrete();
  else if(S.currentPage==="aulas")renderAulas();
  else if(S.currentPage==="carrinho"){
    if(S.carrinhoSubPage==="principal")renderCarrinhoPrincipal();
    else if(S.carrinhoSubPage==="fichas")renderCarrinhoFichas();
    else if(S.carrinhoSubPage==="vendas")renderCarrinhoVendas();
    else if(S.carrinhoSubPage==="anuncios")renderCarrinhoAnuncios();
  }
  else if(S.currentPage==="planoreal")renderPlanoReal();
  else if(S.currentPage==="resumo")renderResumo();
}

// Fecha o dropdown do seletor de funil ao clicar fora dele.
// IMPORTANTE: usa e.composedPath() em vez de e.target.closest(...). O clique
// no próprio botão do seletor dispara render(), que reconstrói o HTML de
// dentro de #funil-wrap (inclusive o botão clicado) ANTES desse clique
// terminar de borbulhar até aqui — nesse ponto e.target já está desconectado
// do DOM e e.target.closest(...) sempre retorna null, fechando o dropdown na
// mesma hora que ele abre. composedPath() é calculado no início do disparo
// do evento (antes da re-renderização), então continua válido mesmo depois
// do DOM mudar por baixo.
document.addEventListener("click",(e)=>{
  if(!S.funilDropdownOpen)return;
  const wrap=document.getElementById("funil-wrap");
  const path=typeof e.composedPath==="function"?e.composedPath():[];
  if(wrap&&path.includes(wrap))return;
  S.funilDropdownOpen=false;
  renderHeader();
});

loadData();
</script>
</body>
</html>
